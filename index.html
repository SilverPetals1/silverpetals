    <!-- Navigation Preserver: Smooth and Fast Internal Navigation -->
    <script>
      (function() {
        window.addEventListener('click', function(e) {
          var targetLink = e.target && e.target.closest ? e.target.closest('a') : null;
          if (targetLink && targetLink.href) {
            var href = targetLink.getAttribute('href') || targetLink.href;
            if (href && !href.startsWith('javascript') && !href.startsWith('#')) {
              var isInternal = href.startsWith('/') || href.startsWith('.') || targetLink.hostname === window.location.hostname;
              if (isInternal && targetLink.target !== '_blank') {
                var dest = targetLink.href;
                setTimeout(function() {
                  if (window.location.href !== dest) {
                    window.location.href = dest;
                  }
                }, 60);
              }
            }
          }
        }, true);
      })();
    </script>
