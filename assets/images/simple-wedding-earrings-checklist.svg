<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <linearGradient id="mistakesBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="100%" stop-color="#F2EBE0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="320" rx="14" fill="url(#mistakesBg)"/>
  <text x="400" y="36" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="17" font-weight="700" fill="#2C2422">Bridal Earring Checklist: 4 Essential Rules</text>
  <text x="400" y="58" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#7A6E6C">Practical steps to guarantee all-day comfort and picture-perfect sparkle</text>

  <!-- Step 1 -->
  <g transform="translate(30, 80)">
    <rect width="170" height="215" rx="8" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <circle cx="85" cy="46" r="22" fill="#FAF4EB" stroke="#C5A059" stroke-width="1.5"/>
    <text x="85" y="53" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#8C6826">1</text>
    <text x="85" y="92" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Wear-Test Trial</text>
    <text x="85" y="112" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8C6826">Pre-Wedding Day</text>
    <text x="85" y="138" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Wear for 4–6 hours</text>
    <text x="85" y="158" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Confirm weight ease</text>
    <text x="85" y="178" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Check sensitivity</text>
    <text x="85" y="202" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#2C2422">Comfort First</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(220, 80)">
    <rect width="170" height="215" rx="8" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <circle cx="85" cy="46" r="22" fill="#FAF4EB" stroke="#C5A059" stroke-width="1.5"/>
    <text x="85" y="53" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#8C6826">2</text>
    <text x="85" y="92" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Secure Backings</text>
    <text x="85" y="112" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8C6826">Snag Protection</text>
    <text x="85" y="138" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Screw backs or locking</text>
    <text x="85" y="158" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Avoid loose open fishhooks</text>
    <text x="85" y="178" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Safe with lace &amp; veils</text>
    <text x="85" y="202" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#2C2422">Zero Lost Earrings</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(410, 80)">
    <rect width="170" height="215" rx="8" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <circle cx="85" cy="46" r="22" fill="#FAF4EB" stroke="#C5A059" stroke-width="1.5"/>
    <text x="85" y="53" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#8C6826">3</text>
    <text x="85" y="92" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Put On Last</text>
    <text x="85" y="112" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8C6826">Preserve Luster</text>
    <text x="85" y="138" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Apply hairspray first</text>
    <text x="85" y="158" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Mist perfumes early</text>
    <text x="85" y="178" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Keeps gems brilliant</text>
    <text x="85" y="202" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#2C2422">Flawless Sparkle</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(600, 80)">
    <rect width="170" height="215" rx="8" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <circle cx="85" cy="46" r="22" fill="#FAF4EB" stroke="#C5A059" stroke-width="1.5"/>
    <text x="85" y="53" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#8C6826">4</text>
    <text x="85" y="92" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Emergency Kit</text>
    <text x="85" y="112" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8C6826">Bridal Suite Prep</text>
    <text x="85" y="138" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Extra silicone clutches</text>
    <text x="85" y="158" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Polishing cloth pouch</text>
    <text x="85" y="178" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Spare stud backups</text>
    <text x="85" y="202" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#2C2422">Stress-Free Day</text>
  </g>
</svg>
