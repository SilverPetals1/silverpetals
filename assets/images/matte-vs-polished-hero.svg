<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="50%" stop-color="#F5EFEB"/>
      <stop offset="100%" stop-color="#EDE4DC"/>
    </linearGradient>

    <!-- Gold Matte Gradients -->
    <linearGradient id="matteRingGrad" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="25%" stop-color="#E5C158"/>
      <stop offset="50%" stop-color="#C59B27"/>
      <stop offset="75%" stop-color="#DDB94D"/>
      <stop offset="100%" stop-color="#B88A1E"/>
    </linearGradient>
    <linearGradient id="matteInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8A6715"/>
      <stop offset="100%" stop-color="#5C4208"/>
    </linearGradient>

    <!-- Gold Polished Gradients -->
    <linearGradient id="polishedRingGrad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#C59B27"/>
      <stop offset="20%" stop-color="#FFF3C4"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E5C158"/>
      <stop offset="70%" stop-color="#A67C1E"/>
      <stop offset="85%" stop-color="#FFF9E0"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
    <linearGradient id="polishedInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7A560F"/>
      <stop offset="100%" stop-color="#4A3405"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FBF9F5" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#5A4A42" flood-opacity="0.08"/>
    </filter>
    <filter id="ringShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="15" stdDeviation="14" flood-color="#3A2818" flood-opacity="0.25"/>
    </filter>

    <!-- Brushed texture pattern -->
    <pattern id="brushedPattern" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1" x2="100" y2="1" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="0.8"/>
      <line x1="0" y1="3" x2="100" y2="3" stroke="#8A6715" stroke-opacity="0.18" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle Header Border Line -->
  <line x1="80" y1="120" x2="1120" y2="120" stroke="#D8C8B8" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Top Brand & Header -->
  <g transform="translate(600, 52)" text-anchor="middle">
    <text font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="14" font-weight="600" letter-spacing="4" fill="#8C7355" text-transform="uppercase">SILVERPETALS™ FINE JEWELRY GUIDES</text>
    <text y="38" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="#2C241E" letter-spacing="0.5">Matte vs. Polished Wedding Rings</text>
    <text y="58" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#7A6858" font-weight="400">Surface Texture, Light Reflection, and Everyday Durability</text>
  </g>

  <!-- LEFT CARD: MATTE FINISH -->
  <g transform="translate(100, 150)">
    <rect width="480" height="430" rx="16" fill="url(#cardGrad)" stroke="#E4D8CC" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Title Badge -->
    <rect x="36" y="28" width="130" height="28" rx="14" fill="#EFE8DE"/>
    <text x="101" y="47" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#755E43" text-anchor="middle" letter-spacing="1">MATTE FINISH</text>
    
    <text x="36" y="86" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="700" fill="#2C241E">Brushed &amp; Satin Luster</text>
    <text x="36" y="110" font-family="'Inter', sans-serif" font-size="13" fill="#7A6858">Diffused light • Velvety surface • Modern restraint</text>

    <!-- Ring Illustration: Matte -->
    <g transform="translate(240, 245)" filter="url(#ringShadow)">
      <!-- Outer Oval -->
      <ellipse cx="0" cy="0" rx="130" ry="75" fill="url(#matteRingGrad)"/>
      <!-- Brushed texture overlay -->
      <ellipse cx="0" cy="0" rx="130" ry="75" fill="url(#brushedPattern)"/>
      <!-- Inner Hole -->
      <ellipse cx="0" cy="4" rx="88" ry="46" fill="url(#matteInnerGrad)"/>
      <!-- Inner lower lip -->
      <path d="M -88,4 A 88,46 0 0,0 88,4 A 88,42 0 0,1 -88,4 Z" fill="#DDB94D" opacity="0.6"/>
      <!-- Soft Velvety Highlight (Diffused) -->
      <ellipse cx="-40" cy="-35" rx="55" ry="16" fill="#FFF4D0" opacity="0.35" transform="rotate(-15, -40, -35)"/>
    </g>

    <!-- Feature Checklist -->
    <g transform="translate(40, 360)" font-family="'Inter', sans-serif" font-size="12.5" fill="#4A3E34">
      <circle cx="8" cy="8" r="4" fill="#C59B27"/>
      <text x="22" y="12" font-weight="600">Soft, non-glare diffused appearance</text>

      <circle cx="8" cy="32" r="4" fill="#C59B27"/>
      <text x="22" y="36" font-weight="600">Hides hairline micro-swirls effortlessly</text>

      <circle cx="8" cy="56" r="4" fill="#C59B27"/>
      <text x="22" y="60" font-weight="600">Fingerprint-resistant for active lifestyles</text>
    </g>
  </g>

  <!-- RIGHT CARD: POLISHED FINISH -->
  <g transform="translate(620, 150)">
    <rect width="480" height="430" rx="16" fill="url(#cardGrad)" stroke="#E4D8CC" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Title Badge -->
    <rect x="36" y="28" width="145" height="28" rx="14" fill="#E8E3DF"/>
    <text x="108" y="47" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#5A4E46" text-anchor="middle" letter-spacing="1">POLISHED FINISH</text>
    
    <text x="36" y="86" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="700" fill="#2C241E">High Mirror Polish</text>
    <text x="36" y="110" font-family="'Inter', sans-serif" font-size="13" fill="#7A6858">Specular reflection • Radiant shine • Ceremonial classic</text>

    <!-- Ring Illustration: Polished -->
    <g transform="translate(240, 245)" filter="url(#ringShadow)">
      <!-- Outer Oval -->
      <ellipse cx="0" cy="0" rx="130" ry="75" fill="url(#polishedRingGrad)"/>
      <!-- Inner Hole -->
      <ellipse cx="0" cy="4" rx="88" ry="46" fill="url(#polishedInnerGrad)"/>
      <!-- Inner lower lip reflection -->
      <path d="M -88,4 A 88,46 0 0,0 88,4 A 88,42 0 0,1 -88,4 Z" fill="#FFF3C4" opacity="0.75"/>
      <!-- Intense Mirror Flare Highlight -->
      <ellipse cx="-45" cy="-38" rx="40" ry="10" fill="#FFFFFF" opacity="0.9" transform="rotate(-15, -45, -38)"/>
      <!-- Star Sparkle on Polished Edge -->
      <path d="M -70,-38 Q -60,-38 -60,-48 Q -60,-38 -50,-38 Q -60,-38 -60,-28 Q -60,-38 -70,-38 Z" fill="#FFFFFF"/>
      <circle cx="-60" cy="-38" r="3" fill="#FFFFFF"/>
    </g>

    <!-- Feature Checklist -->
    <g transform="translate(40, 360)" font-family="'Inter', sans-serif" font-size="12.5" fill="#4A3E34">
      <circle cx="8" cy="8" r="4" fill="#A67C1E"/>
      <text x="22" y="12" font-weight="600">Brilliant, celebratory mirror reflection</text>

      <circle cx="8" cy="32" r="4" fill="#A67C1E"/>
      <text x="22" y="36" font-weight="600">Amplifies diamond and gemstone sparkle</text>

      <circle cx="8" cy="56" r="4" fill="#A67C1E"/>
      <text x="22" y="60" font-weight="600">Quickly buffed to showroom shine at home</text>
    </g>
  </g>
</svg>
