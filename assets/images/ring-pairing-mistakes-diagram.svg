<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="bgBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="100%" stop-color="#F2EBE1"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6"/>
      <stop offset="40%" stop-color="#E5C388"/>
      <stop offset="70%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8C6826"/>
    </linearGradient>
    <linearGradient id="platRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#DCE2E6"/>
      <stop offset="70%" stop-color="#B0B8C0"/>
      <stop offset="100%" stop-color="#7A8490"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4A3E3D" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="800" height="360" rx="12" fill="url(#bgBox)"/>
  <rect x="15" y="15" width="770" height="330" rx="10" fill="none" stroke="#DCCEC0" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Left: Rings Interaction Illustration -->
  <g transform="translate(180, 180)" filter="url(#boxShadow)">
    <!-- Engagement Ring with Diamond -->
    <ellipse cx="-45" cy="0" rx="65" ry="85" fill="none" stroke="url(#goldRing)" stroke-width="14"/>
    <!-- Diamond Setting -->
    <path d="M -45 -105 L -25 -80 L -65 -80 Z" fill="#EAF3FA" stroke="#A8C4DF" stroke-width="2"/>
    <polygon points="-45,-105 -25,-80 -45,-70 -65,-80" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Contoured Wedding Band Sitting Flush -->
    <ellipse cx="45" cy="0" rx="65" ry="85" fill="none" stroke="url(#platRing)" stroke-width="14"/>
    <!-- Center Flush Alignment Indicator -->
    <line x1="0" y1="-85" x2="0" y2="85" stroke="#C5A059" stroke-width="2" stroke-dasharray="4,4"/>
  </g>

  <!-- Right: Comparison Details -->
  <g transform="translate(420, 75)">
    <rect width="320" height="210" rx="10" fill="#FFFFFF" stroke="#E5DACD" stroke-width="1" filter="url(#boxShadow)"/>
    
    <text x="25" y="40" font-family="'Cinzel', Georgia, serif" font-size="17" font-weight="700" fill="#2C2422">Ring Pairing &amp; Metal Harmony</text>
    
    <circle cx="35" cy="80" r="4" fill="#C5A059"/>
    <text x="50" y="84" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#3D3230">Matching Metal Hardness</text>
    <text x="50" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#7A6E6C">Prevents platinum from wearing down gold</text>

    <circle cx="35" cy="135" r="4" fill="#C5A059"/>
    <text x="50" y="139" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#3D3230">Flush Profile vs Shadow Bands</text>
    <text x="50" y="157" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#7A6E6C">Leaves no uncomfortable gap or friction</text>

    <rect x="25" y="172" width="270" height="26" rx="4" fill="#F6EFE5"/>
    <text x="160" y="189" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#8C6826">SILVERPETALS™ BRIDAL GUIDE</text>
  </g>
</svg>
