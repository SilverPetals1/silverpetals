<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF8"/>
      <stop offset="100%" stop-color="#F3ECE2"/>
    </linearGradient>
    <linearGradient id="silverPurityGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="alloyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="360" rx="16" fill="url(#bgGrad)" stroke="#E7DDD1" stroke-width="1.5"/>

  <!-- Header -->
  <text x="400" y="42" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="700" fill="#1D2124" letter-spacing="1">925 STERLING SILVER ALLOY METALLURGY</text>
  <text x="400" y="66" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#6B7280">The Precise Ratio That Gives Floral Necklaces Heirloom Strength &amp; Optical Luminescence</text>

  <!-- Progress / Proportion Bar -->
  <g transform="translate(60, 95)">
    <rect width="680" height="42" rx="21" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
    <!-- 92.5% bar (629px) -->
    <rect width="629" height="42" rx="21" fill="url(#silverPurityGrad)"/>
    <!-- 7.5% bar (51px) -->
    <path d="M 629,0 L 659,0 A 21,21 0 0,1 680,21 A 21,21 0 0,1 659,42 L 629,42 Z" fill="url(#alloyGrad)"/>
    
    <text x="314" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#334155">92.5% PURE PRECIOUS SILVER</text>
    <text x="655" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">7.5%</text>
  </g>

  <!-- 3 Quality Pillars -->
  <!-- Pillar 1 -->
  <g transform="translate(60, 165)">
    <rect width="210" height="160" rx="10" fill="#FFFFFF" stroke="#E5DCD1" stroke-width="1.5"/>
    <circle cx="105" cy="40" r="22" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <!-- Sparkle/Luster icon -->
    <path d="M 105,26 L 108,37 L 119,40 L 108,43 L 105,54 L 102,43 L 91,40 L 102,37 Z" fill="#64748B"/>
    <text x="105" y="82" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#1D2124">95%+ Reflectivity</text>
    <text x="105" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#4B5563">Brightest optical luster</text>
    <text x="105" y="123" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#4B5563">of any precious metal</text>
    <text x="105" y="145" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#8C6826">Moonlight Radiance</text>
  </g>

  <!-- Pillar 2 -->
  <g transform="translate(295, 165)">
    <rect width="210" height="160" rx="10" fill="#FFFFFF" stroke="#E5DCD1" stroke-width="1.5"/>
    <circle cx="105" cy="40" r="22" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <!-- Strength / Shield icon -->
    <path d="M 105,26 L 117,31 L 117,44 C 117,50 105,55 105,55 C 105,55 93,50 93,44 L 93,31 Z" fill="#D97706"/>
    <text x="105" y="82" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#1D2124">Tensile Strength</text>
    <text x="105" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#4B5563">Copper alloy fortifies</text>
    <text x="105" y="123" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#4B5563">delicate petal wirework</text>
    <text x="105" y="145" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#8C6826">Prevents Bending</text>
  </g>

  <!-- Pillar 3 -->
  <g transform="translate(530, 165)">
    <rect width="210" height="160" rx="10" fill="#FFFFFF" stroke="#E5DCD1" stroke-width="1.5"/>
    <circle cx="105" cy="40" r="22" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <!-- Hypoallergenic / Leaf heart icon -->
    <path d="M 105,27 C 114,20 122,30 115,42 L 105,53 L 95,42 C 88,30 96,20 105,27 Z" fill="#16A34A"/>
    <text x="105" y="82" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#1D2124">Hypoallergenic</text>
    <text x="105" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#4B5563">100% Nickel &amp; Lead Free</text>
    <text x="105" y="123" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#4B5563">gentle on collarbone skin</text>
    <text x="105" y="145" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#16A34A">Safe for Daily Wear</text>
  </g>
</svg>
