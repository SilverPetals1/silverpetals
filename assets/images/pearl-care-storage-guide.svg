<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <linearGradient id="bgP8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7"/><stop offset="100%" stop-color="#F2EBE0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="320" rx="14" fill="url(#bgP8)"/>
  <text x="400" y="38" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="17" font-weight="700" fill="#2C2422">Bridal Pearl Care: "Last On, First Off" Protocol</text>
  <g transform="translate(40, 65)">
    <rect width="220" height="225" rx="8" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <text x="110" y="40" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#2C2422">1. Morning Prep</text>
    <line x1="20" y1="52" x2="200" y2="52" stroke="#F0E5D8" stroke-width="1"/>
    <text x="110" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#8C6826">"Last On" Rule</text>
    <text x="110" y="110" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#7A6E6C">Apply perfume, hairspray,</text>
    <text x="110" y="128" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#7A6E6C">and bridal makeup FIRST.</text>
    <text x="110" y="156" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#7A6E6C">Chemicals in beauty sprays</text>
    <text x="110" y="174" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#7A6E6C">erode organic pearl nacre.</text>
  </g>
  <g transform="translate(290, 65)">
    <rect width="220" height="225" rx="8" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <text x="110" y="40" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#2C2422">2. Post-Reception</text>
    <line x1="20" y1="52" x2="200" y2="52" stroke="#F0E5D8" stroke-width="1"/>
    <text x="110" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#8C6826">"First Off" &amp; Wipe</text>
    <text x="110" y="110" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#7A6E6C">Remove earrings before sleep</text>
    <text x="110" y="128" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#7A6E6C">or wedding dress unbuttoning.</text>
    <text x="110" y="156" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#7A6E6C">Gently wipe pearls with a</text>
    <text x="110" y="174" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#7A6E6C">soft microfiber cloth.</text>
  </g>
  <g transform="translate(540, 65)">
    <rect width="220" height="225" rx="8" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <text x="110" y="40" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#2C2422">3. Storage &amp; Future</text>
    <line x1="20" y1="52" x2="200" y2="52" stroke="#F0E5D8" stroke-width="1"/>
    <text x="110" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#8C6826">Soft Fabric Pouch</text>
    <text x="110" y="110" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#7A6E6C">Never store alongside diamonds</text>
    <text x="110" y="128" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#7A6E6C">which scratch soft nacre.</text>
    <text x="110" y="156" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#7A6E6C">Avoid airtight plastic bags;</text>
    <text x="110" y="174" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#7A6E6C">pearls need subtle air moisture.</text>
  </g>
</svg>
