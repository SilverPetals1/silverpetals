<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="circCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF9F6"/>
    </linearGradient>
    <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C99D"/>
      <stop offset="50%" stop-color="#CFAA7A"/>
      <stop offset="100%" stop-color="#A9834F"/>
    </linearGradient>
    <filter id="circShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="480" rx="16" fill="#F4EFE6"/>

  <!-- Top Title Bar -->
  <rect x="0" y="0" width="1000" height="85" rx="16" fill="#128994"/>
  <text x="40" y="52" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="700" fill="#FFFFFF">Visual Ring Sizing Circles &amp; Millimeter Scale</text>
  <text x="780" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#E2C99D">US / CAN SIZES 4–12</text>

  <!-- Row 1: Sizes 4, 5, 6, 7 -->
  <!-- Size 4 -->
  <g transform="translate(60, 115)">
    <rect width="195" height="150" rx="12" fill="url(#circCardGrad)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#circShadow)"/>
    <circle cx="97" cy="65" r="34" fill="none" stroke="url(#ringGold)" stroke-width="4"/>
    <text x="97" y="69" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#2B2D42">US 4</text>
    <text x="97" y="125" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#128994">Ø 14.9 mm | 46.8 mm</text>
  </g>

  <!-- Size 5 -->
  <g transform="translate(285, 115)">
    <rect width="195" height="150" rx="12" fill="url(#circCardGrad)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#circShadow)"/>
    <circle cx="97" cy="65" r="36" fill="none" stroke="url(#ringGold)" stroke-width="4"/>
    <text x="97" y="69" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#2B2D42">US 5</text>
    <text x="97" y="125" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#128994">Ø 15.7 mm | 49.3 mm</text>
  </g>

  <!-- Size 6 -->
  <g transform="translate(510, 115)">
    <rect width="195" height="150" rx="12" fill="url(#circCardGrad)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#circShadow)"/>
    <circle cx="97" cy="65" r="39" fill="none" stroke="url(#ringGold)" stroke-width="4"/>
    <text x="97" y="69" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#2B2D42">US 6</text>
    <text x="97" y="125" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#128994">Ø 16.5 mm | 51.9 mm</text>
  </g>

  <!-- Size 7 -->
  <g transform="translate(735, 115)">
    <rect width="195" height="150" rx="12" fill="url(#circCardGrad)" stroke="#128994" stroke-width="2" filter="url(#circShadow)"/>
    <circle cx="97" cy="65" r="42" fill="none" stroke="#128994" stroke-width="5"/>
    <text x="97" y="69" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#128994">US 7 (Avg)</text>
    <text x="97" y="125" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#128994">Ø 17.3 mm | 54.4 mm</text>
  </g>

  <!-- Row 2: Sizes 8, 9, 10, 11/12 -->
  <!-- Size 8 -->
  <g transform="translate(60, 290)">
    <rect width="195" height="150" rx="12" fill="url(#circCardGrad)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#circShadow)"/>
    <circle cx="97" cy="65" r="44" fill="none" stroke="url(#ringGold)" stroke-width="4"/>
    <text x="97" y="69" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#2B2D42">US 8</text>
    <text x="97" y="125" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#128994">Ø 18.1 mm | 57.0 mm</text>
  </g>

  <!-- Size 9 -->
  <g transform="translate(285, 290)">
    <rect width="195" height="150" rx="12" fill="url(#circCardGrad)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#circShadow)"/>
    <circle cx="97" cy="65" r="46" fill="none" stroke="url(#ringGold)" stroke-width="4"/>
    <text x="97" y="69" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#2B2D42">US 9</text>
    <text x="97" y="125" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#128994">Ø 18.9 mm | 59.5 mm</text>
  </g>

  <!-- Size 10 -->
  <g transform="translate(510, 290)">
    <rect width="195" height="150" rx="12" fill="url(#circCardGrad)" stroke="#128994" stroke-width="2" filter="url(#circShadow)"/>
    <circle cx="97" cy="65" r="48" fill="none" stroke="#128994" stroke-width="5"/>
    <text x="97" y="69" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#128994">US 10 (Avg)</text>
    <text x="97" y="125" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#128994">Ø 19.8 mm | 62.1 mm</text>
  </g>

  <!-- Size 12 -->
  <g transform="translate(735, 290)">
    <rect width="195" height="150" rx="12" fill="url(#circCardGrad)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#circShadow)"/>
    <circle cx="97" cy="65" r="52" fill="none" stroke="url(#ringGold)" stroke-width="4"/>
    <text x="97" y="69" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#2B2D42">US 12</text>
    <text x="97" y="125" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#128994">Ø 21.4 mm | 67.2 mm</text>
  </g>
</svg>
