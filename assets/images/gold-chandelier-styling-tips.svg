<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <linearGradient id="tipsChBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="100%" stop-color="#F2EBE0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="320" rx="14" fill="url(#tipsChBg)"/>
  <text x="400" y="36" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="17" font-weight="700" fill="#2C2422">Bridal Statement Earring Rules: 4 Styling Dos &amp; Don'ts</text>
  <text x="400" y="58" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#7A6E6C">Expert tips to ensure flawless bridal pictures and stress-free celebrations</text>

  <!-- Rule 1 -->
  <g transform="translate(30, 80)">
    <rect width="170" height="215" rx="8" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <circle cx="85" cy="46" r="22" fill="#FAF4EB" stroke="#C5A059" stroke-width="1.5"/>
    <text x="85" y="53" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#8C6826">1</text>
    <text x="85" y="92" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Skip Heavy Chokers</text>
    <text x="85" y="112" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8C6826">Let Earrings Lead</text>
    <text x="85" y="138" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Bare collarbone</text>
    <text x="85" y="158" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">prevents cluttered look.</text>
    <text x="85" y="178" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Add a slim bracelet.</text>
    <text x="85" y="202" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#2C2422">Clean Balance</text>
  </g>

  <!-- Rule 2 -->
  <g transform="translate(220, 80)">
    <rect width="170" height="215" rx="8" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <circle cx="85" cy="46" r="22" fill="#FAF4EB" stroke="#C5A059" stroke-width="1.5"/>
    <text x="85" y="53" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#8C6826">2</text>
    <text x="85" y="92" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Dress Rehearsal</text>
    <text x="85" y="112" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8C6826">Wear at Fitting</text>
    <text x="85" y="138" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Test with veil &amp; gown</text>
    <text x="85" y="158" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Check shoulder contact</text>
    <text x="85" y="178" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Verify 4-hour comfort</text>
    <text x="85" y="202" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#2C2422">Zero Surprises</text>
  </g>

  <!-- Rule 3 -->
  <g transform="translate(410, 80)">
    <rect width="170" height="215" rx="8" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <circle cx="85" cy="46" r="22" fill="#FAF4EB" stroke="#C5A059" stroke-width="1.5"/>
    <text x="85" y="53" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#8C6826">3</text>
    <text x="85" y="92" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Put On Last</text>
    <text x="85" y="112" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8C6826">Protect Finish</text>
    <text x="85" y="138" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Apply hairspray first</text>
    <text x="85" y="158" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Mist perfumes early</text>
    <text x="85" y="178" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Keeps gold mirror-clean</text>
    <text x="85" y="202" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#2C2422">Maximum Shine</text>
  </g>

  <!-- Rule 4 -->
  <g transform="translate(600, 80)">
    <rect width="170" height="215" rx="8" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <circle cx="85" cy="46" r="22" fill="#FAF4EB" stroke="#C5A059" stroke-width="1.5"/>
    <text x="85" y="53" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#8C6826">4</text>
    <text x="85" y="92" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Reception Backup</text>
    <text x="85" y="112" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8C6826">Late Night Party</text>
    <text x="85" y="138" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Pack simple gold studs</text>
    <text x="85" y="158" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Swap after portraits</text>
    <text x="85" y="178" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Dance freely till 2 AM</text>
    <text x="85" y="202" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#2C2422">Dancing Comfort</text>
