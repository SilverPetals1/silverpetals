<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <linearGradient id="tipsSilk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EE"/>
      <stop offset="50%" stop-color="#F2E5D3"/>
      <stop offset="100%" stop-color="#E8D7C2"/>
    </linearGradient>

    <linearGradient id="tipsGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAB0"/>
      <stop offset="50%" stop-color="#D9A83A"/>
      <stop offset="100%" stop-color="#9C6F19"/>
    </linearGradient>

    <filter id="softTipsShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4A341E" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="320" rx="14" fill="url(#tipsSilk)"/>
  <path d="M 0 280 Q 250 170 500 290 T 800 200 L 800 320 L 0 320 Z" fill="#DFC9B2" opacity="0.35"/>
  <path d="M 0 50 Q 260 170 540 40 T 800 120 L 800 0 L 0 0 Z" fill="#FFFFFF" opacity="0.45"/>

  <text x="400" y="38" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="700" fill="#2C2018" letter-spacing="1">Bridal Statement Earring Rules &amp; Styling Protocol</text>
  <text x="400" y="58" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#755E4E">The 4 essential styling principles every bride wearing chandeliers must follow</text>

  <!-- Rule 1: Skip Heavy Necklaces -->
  <g transform="translate(30, 78)" filter="url(#softTipsShadow)">
    <rect width="170" height="215" rx="10" fill="#FFFFFF" stroke="#E8DACB" stroke-width="1.2"/>
    <circle cx="85" cy="38" r="20" fill="#FAF5EE" stroke="#D5C2AA"/>
    <text x="85" y="44" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="700" fill="#8C6826">01</text>
    <text x="85" y="86" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="13" font-weight="700" fill="#2C2018">Rule of Balance</text>
    <line x1="30" y1="96" x2="140" y2="96" stroke="#EFE5D8" stroke-width="1"/>
    <text x="85" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#8C6826">Skip Heavy Chokers</text>
    <text x="85" y="136" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Let earrings take focus</text>
    <text x="85" y="152" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Pair with tennis bracelet</text>
    <text x="85" y="168" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Bare collarbone elegance</text>
    <rect x="25" y="184" width="120" height="18" rx="4" fill="#FAF5EE"/>
    <text x="85" y="196" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#8C6826">Zero Clutter</text>
  </g>

  <!-- Rule 2: Gown Fitting Rehearsal -->
  <g transform="translate(220, 78)" filter="url(#softTipsShadow)">
    <rect width="170" height="215" rx="10" fill="#FFFFFF" stroke="#E8DACB" stroke-width="1.2"/>
    <circle cx="85" cy="38" r="20" fill="#FAF5EE" stroke="#D5C2AA"/>
    <text x="85" y="44" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="700" fill="#8C6826">02</text>
    <text x="85" y="86" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="13" font-weight="700" fill="#2C2018">Trial Rehearsal</text>
    <line x1="30" y1="96" x2="140" y2="96" stroke="#EFE5D8" stroke-width="1"/>
    <text x="85" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#8C6826">Wear for 3-4 Hours</text>
    <text x="85" y="136" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Test at final gown trial</text>
    <text x="85" y="152" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Verify shoulder clearance</text>
    <text x="85" y="168" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Ensure comfort &amp; weight</text>
    <rect x="25" y="184" width="120" height="18" rx="4" fill="#FAF5EE"/>
    <text x="85" y="196" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#8C6826">No Surprises</text>
  </g>

  <!-- Rule 3: Hairspray First -->
  <g transform="translate(410, 78)" filter="url(#softTipsShadow)">
    <rect width="170" height="215" rx="10" fill="#FFFFFF" stroke="#E8DACB" stroke-width="1.2"/>
    <circle cx="85" cy="38" r="20" fill="#FAF5EE" stroke="#D5C2AA"/>
    <text x="85" y="44" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="700" fill="#8C6826">03</text>
    <text x="85" y="86" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="13" font-weight="700" fill="#2C2018">Hairspray First</text>
    <line x1="30" y1="96" x2="140" y2="96" stroke="#EFE5D8" stroke-width="1"/>
    <text x="85" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#8C6826">Last Item to Wear</text>
    <text x="85" y="136" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Alcohol dulls gold luster</text>
    <text x="85" y="152" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Perfume clouds diamonds</text>
    <text x="85" y="168" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Put on after hair &amp; makeup</text>
    <rect x="25" y="184" width="120" height="18" rx="4" fill="#FAF5EE"/>
    <text x="85" y="196" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#8C6826">Luster Protection</text>
  </g>

  <!-- Rule 4: Reception Backup Studs -->
  <g transform="translate(600, 78)" filter="url(#softTipsShadow)">
    <rect width="170" height="215" rx="10" fill="#FFFFFF" stroke="#E8DACB" stroke-width="1.2"/>
    <circle cx="85" cy="38" r="20" fill="#FAF5EE" stroke="#D5C2AA"/>
    <text x="85" y="44" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="700" fill="#8C6826">04</text>
    <text x="85" y="86" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="13" font-weight="700" fill="#2C2018">Reception Backup</text>
    <line x1="30" y1="96" x2="140" y2="96" stroke="#EFE5D8" stroke-width="1"/>
    <text x="85" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#8C6826">Emergency Kit Studs</text>
    <text x="85" y="136" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Pack dainty gold studs</text>
    <text x="85" y="152" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Swap for late-night dance</text>
    <text x="85" y="168" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Keeps earlobes fresh</text>
    <rect x="25" y="184" width="120" height="18" rx="4" fill="#FAF5EE"/>
    <text x="85" y="196" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#8C6826">Party-Ready Ease</text>
  </g>
</svg>
