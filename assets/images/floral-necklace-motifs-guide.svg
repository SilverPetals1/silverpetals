<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="bgGradMotifs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF8"/>
      <stop offset="100%" stop-color="#F2EBE0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="360" rx="16" fill="url(#bgGradMotifs)" stroke="#E7DDD1" stroke-width="1.5"/>

  <!-- Title -->
  <text x="400" y="42" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="700" fill="#1D2124" letter-spacing="1">POPULAR FLORAL PENDANT MOTIFS &amp; MEANINGS</text>
  <text x="400" y="66" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#6B7280">The Victorian Language of Flowers (Floriography) Expressed in Solid Precious Silver</text>

  <!-- 4 Cards -->
  <!-- Card 1: Rose -->
  <g transform="translate(40, 95)">
    <rect width="165" height="230" rx="10" fill="#FFFFFF" stroke="#E5DCD1" stroke-width="1.5"/>
    <circle cx="82" cy="45" r="22" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
    <!-- Rose flower vector -->
    <path d="M 82,34 C 77,34 74,38 74,43 C 74,51 82,57 82,57 C 82,57 90,51 90,43 C 90,38 87,34 82,34 Z" fill="#EF4444"/>
    
    <text x="82" y="92" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="700" fill="#1D2124">THE ROSE</text>
    <text x="82" y="115" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" fill="#8C6826">Love &amp; Devotion</text>

    <text x="82" y="145" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#4B5563">Sculpted layered</text>
    <text x="82" y="163" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#4B5563">petals symbolizing</text>
    <text x="82" y="181" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#4B5563">enduring passion</text>
    <text x="82" y="199" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#4B5563">&amp; romantic vows.</text>

    <rect x="25" y="210" width="115" height="22" rx="11" fill="#FEF2F2"/>
    <text x="82" y="225" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#B91C1C">Anniversary Gift</text>
  </g>

  <!-- Card 2: Lotus -->
  <g transform="translate(225, 95)">
    <rect width="165" height="230" rx="10" fill="#FFFFFF" stroke="#E5DCD1" stroke-width="1.5"/>
    <circle cx="82" cy="45" r="22" fill="#FDF4FF" stroke="#C084FC" stroke-width="1.5"/>
    <!-- Lotus icon -->
    <path d="M 82,30 C 82,30 70,42 70,49 C 70,55 76,57 82,57 C 88,57 94,55 94,49 C 94,42 82,30 82,30 Z" fill="#C084FC"/>
    <path d="M 82,36 C 82,36 75,44 75,49 C 75,53 78,55 82,55 C 86,55 89,53 89,49 C 89,44 82,36 82,36 Z" fill="#FFFFFF"/>

    <text x="82" y="92" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="700" fill="#1D2124">THE LOTUS</text>
    <text x="82" y="115" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" fill="#8C6826">Purity &amp; Rebirth</text>

    <text x="82" y="145" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#4B5563">Rises unblemished</text>
    <text x="82" y="163" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#4B5563">through water;</text>
    <text x="82" y="181" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#4B5563">represents quiet</text>
    <text x="82" y="199" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#4B5563">inner resilience.</text>

    <rect x="25" y="210" width="115" height="22" rx="11" fill="#FDF4FF"/>
    <text x="82" y="225" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#7E22CE">Transformation</text>
  </g>

  <!-- Card 3: Cherry Blossom -->
  <g transform="translate(410, 95)">
    <rect width="165" height="230" rx="10" fill="#FFFFFF" stroke="#E5DCD1" stroke-width="1.5"/>
    <circle cx="82" cy="45" r="22" fill="#FDF2F8" stroke="#F472B6" stroke-width="1.5"/>
    <!-- Blossom 5-petal star -->
    <path d="M 82,32 L 85,41 L 94,41 L 87,46 L 90,55 L 82,50 L 74,55 L 77,46 L 70,41 L 79,41 Z" fill="#F472B6"/>

    <text x="82" y="92" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#1D2124">BLOSSOM</text>
    <text x="82" y="115" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" fill="#8C6826">Grace &amp; Hope</text>

    <text x="82" y="145" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#4B5563">Celebrates spring</text>
    <text x="82" y="163" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#4B5563">renewal, delicate</text>
    <text x="82" y="181" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#4B5563">feminine beauty,</text>
    <text x="82" y="199" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#4B5563">&amp; fresh horizons.</text>

    <rect x="25" y="210" width="115" height="22" rx="11" fill="#FDF2F8"/>
    <text x="82" y="225" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#BE185D">Daily Signature</text>
  </g>

  <!-- Card 4: Daisy -->
  <g transform="translate(595, 95)">
    <rect width="165" height="230" rx="10" fill="#FFFFFF" stroke="#E5DCD1" stroke-width="1.5"/>
    <circle cx="82" cy="45" r="22" fill="#FEFCE8" stroke="#EAB308" stroke-width="1.5"/>
    <circle cx="82" cy="45" r="8" fill="#EAB308"/>

    <text x="82" y="92" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="700" fill="#1D2124">THE DAISY</text>
    <text x="82" y="115" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" fill="#8C6826">Joy &amp; Friendship</text>

    <text x="82" y="145" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#4B5563">Radiate petals</text>
    <text x="82" y="163" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#4B5563">inspiring carefree</text>
    <text x="82" y="181" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#4B5563">optimism, warmth</text>
    <text x="82" y="199" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#4B5563">&amp; true loyalty.</text>

    <rect x="25" y="210" width="115" height="22" rx="11" fill="#FEFCE8"/>
    <text x="82" y="225" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#A16207">Milestone Gift</text>
  </g>
</svg>
