<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <defs>
    <linearGradient id="hairBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="100%" stop-color="#F3ECE2"/>
    </linearGradient>
  </defs>

  <rect width="800" height="350" rx="14" fill="url(#hairBg)"/>
  <text x="400" y="38" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="700" fill="#2C2422">Bridal Hairstyle &amp; Simple Earring Match</text>
  <text x="400" y="60" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#7A6E6C">Ensuring your earrings shine beautifully with updos, waves, braids, and veils</text>

  <!-- 1. Sleek Updo -->
  <g transform="translate(30, 85)">
    <rect width="170" height="235" rx="10" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <!-- Updo Icon Graphic -->
    <circle cx="85" cy="42" r="16" fill="#D5C2AA"/>
    <ellipse cx="85" cy="56" rx="20" ry="12" fill="#8C6826" opacity="0.85"/>
    <circle cx="85" cy="34" r="8" fill="#8C6826"/>
    <text x="85" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Sleek Updo / Bun</text>
    <text x="85" y="120" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8C6826">Petite Drops &amp; Studs</text>
    <text x="85" y="146" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Ears fully exposed</text>
    <text x="85" y="166" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Curved ear climbers</text>
    <text x="85" y="186" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Refined clean nape</text>
    <text x="85" y="214" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#2C2422">Full Visibility</text>
  </g>

  <!-- 2. Loose Waves -->
  <g transform="translate(220, 85)">
    <rect width="170" height="235" rx="10" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <!-- Waves Icon Graphic -->
    <circle cx="85" cy="42" r="14" fill="#D5C2AA"/>
    <path d="M 68 40 Q 64 56 68 68 M 102 40 Q 106 56 102 68" fill="none" stroke="#8C6826" stroke-width="4" stroke-linecap="round"/>
    <text x="85" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Loose Waves</text>
    <text x="85" y="120" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8C6826">Sleek Huggies &amp; Drops</text>
    <text x="85" y="146" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Peeks through tresses</text>
    <text x="85" y="166" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Catches motion &amp; light</text>
    <text x="85" y="186" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Studs can hide in hair</text>
    <text x="85" y="214" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#2C2422">Subtle Glimmer</text>
  </g>

  <!-- 3. Braids & Half-Up -->
  <g transform="translate(410, 85)">
    <rect width="170" height="235" rx="10" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <!-- Braid Icon Graphic -->
    <circle cx="85" cy="40" r="14" fill="#D5C2AA"/>
    <path d="M 82 50 L 88 56 L 82 62 L 88 68" fill="none" stroke="#8C6826" stroke-width="3" stroke-linecap="round"/>
    <text x="85" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Braids &amp; Half-Up</text>
    <text x="85" y="120" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8C6826">Organic Pearl Drops</text>
    <text x="85" y="146" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Boho botanical vibe</text>
    <text x="85" y="166" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Baroque freshwater pearl</text>
    <text x="85" y="186" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Floral motif studs</text>
    <text x="85" y="214" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#2C2422">Romantic &amp; Airy</text>
  </g>

  <!-- 4. Cathedral & Tulle Veil -->
  <g transform="translate(600, 85)">
    <rect width="170" height="235" rx="10" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <!-- Veil Silhouette -->
    <path d="M 75 36 C 85 30 85 30 95 36 C 98 50 106 68 106 72 L 64 72 C 64 68 72 50 75 36 Z" fill="#F4ECE1" stroke="#C5A059" stroke-width="1.2" stroke-dasharray="2,2"/>
    <text x="85" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Wearing a Veil</text>
    <text x="85" y="120" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8C6826">Snag-Free Clasps</text>
    <text x="85" y="146" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Smooth bezel settings</text>
    <text x="85" y="166" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Avoid open fishhooks</text>
    <text x="85" y="186" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Won't catch on tulle</text>
    <text x="85" y="214" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#2C2422">Tulle Safe</text>
  </g>
</svg>
