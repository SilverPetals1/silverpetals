  <g transform="translate(650, 80)">
    <rect width="112" height="235" rx="8" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <path d="M 46 62 Q 56 48 66 38" fill="none" stroke="#C5A059" stroke-width="2.5"/>
    <circle cx="48" cy="60" r="3.5" fill="#FFF" stroke="#C5A059" stroke-width="1.5"/>
    <circle cx="56" cy="49" r="3" fill="#FFF" stroke="#C5A059" stroke-width="1.5"/>
    <circle cx="64" cy="40" r="2.5" fill="#FFF" stroke="#C5A059" stroke-width="1.5"/>
