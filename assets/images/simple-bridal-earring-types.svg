    <text x="56" y="145" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#7A6E6C">Hugs lobe</text>
    <text x="56" y="165" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#7A6E6C">Micropavé stones</text>
    <text x="56" y="185" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#7A6E6C">All-day comfort</text>
