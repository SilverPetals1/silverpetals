  </defs>

  <rect width="800" height="350" rx="14" fill="url(#typesBg)"/>
  <text x="400" y="36" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="17" font-weight="700" fill="#2C2422">6 Signature Styles of Simple Bridal Earrings</text>
