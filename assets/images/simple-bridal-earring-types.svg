  </g>

  <!-- Card 2: Pearl Drops -->
  <g transform="translate(154, 80)">
    <rect width="112" height="235" rx="8" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <circle cx="56" cy="38" r="4" fill="#C5A059"/>
    <line x1="56" y1="42" x2="56" y2="52" stroke="#C5A059" stroke-width="1.8"/>
    <ellipse cx="56" cy="65" rx="10" ry="14" fill="url(#smPearl)" stroke="#D5C2AA" stroke-width="1"/>
    <text x="56" y="95" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Pearl Drop</text>
    <text x="56" y="118" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#8C6826">Soft Romance</text>
    <text x="56" y="145" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#7A6E6C">Gentle motion</text>
