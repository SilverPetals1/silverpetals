  <!-- Card 1: Solitaire Studs -->
  <g transform="translate(30, 80)">
    <rect width="112" height="235" rx="8" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <circle cx="56" cy="50" r="14" fill="#FAF4EB" stroke="#C5A059" stroke-width="2"/>
    <circle cx="56" cy="50" r="8" fill="#FFF"/>
    <text x="56" y="95" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Solitaire Stud</text>
    <text x="56" y="118" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#8C6826">Classic &amp; Clean</text>
    <text x="56" y="145" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#7A6E6C">Flush fit</text>
    <text x="56" y="165" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#7A6E6C">Zero snag risk</text>
    <text x="56" y="185" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#7A6E6C">Max sparkle</text>
