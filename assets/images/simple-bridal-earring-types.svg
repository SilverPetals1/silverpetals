    <text x="56" y="145" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#7A6E6C">Traces lobe edge</text>
    <text x="56" y="165" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#7A6E6C">Botanical curves</text>
    <text x="56" y="185" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#7A6E6C">Updo favorite</text>
    <text x="56" y="215" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#2C2422">Modern Edge</text>
