<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <linearGradient id="careChBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="100%" stop-color="#F2EBE0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="320" rx="14" fill="url(#careChBg)"/>
  <text x="400" y="38" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="700" fill="#2C2422">Gold Chandelier Care &amp; Maintenance Protocol</text>
  <text x="400" y="60" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#7A6E6C">Preserving intricate links, tier hinges, and golden luster for decades</text>

  <!-- 1. Cleaning -->
  <g transform="translate(30, 85)">
    <rect width="225" height="215" rx="10" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <circle cx="112" cy="46" r="22" fill="#FAF4EB" stroke="#C5A059" stroke-width="1.5"/>
    <text x="112" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#8C6826">🧼</text>
    <text x="112" y="94" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Gentle Warm Soak</text>
    <text x="112" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8C6826">Pre-Wedding Shine</text>
    <text x="112" y="142" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Warm water + mild dish soap</text>
    <text x="112" y="162" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Soft-bristled baby brush</text>
    <text x="112" y="188" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#2C2422">Never Boil or Steam</text>
  </g>

  <!-- 2. Flat Storage -->
  <g transform="translate(285, 85)">
    <rect width="225" height="215" rx="10" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <circle cx="112" cy="46" r="22" fill="#FAF4EB" stroke="#C5A059" stroke-width="1.5"/>
    <text x="112" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#8C6826">📦</text>
    <text x="112" y="94" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Flat Velvet Storage</text>
    <text x="112" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8C6826">Zero Tangled Tiers</text>
    <text x="112" y="142" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Individual padded slots</text>
    <text x="112" y="162" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Never toss in pouches</text>
    <text x="112" y="188" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#2C2422">Protects Delicate Pins</text>
  </g>

  <!-- 3. Clasp Check -->
  <g transform="translate(540, 85)">
    <rect width="225" height="215" rx="10" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <circle cx="112" cy="46" r="22" fill="#FAF4EB" stroke="#C5A059" stroke-width="1.5"/>
    <text x="112" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#8C6826">🔒</text>
    <text x="112" y="94" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Clasp Inspection</text>
    <text x="112" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8C6826">Loss Prevention</text>
    <text x="112" y="142" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Check leverback snap click</text>
    <text x="112" y="162" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Test screw threading</text>
    <text x="112" y="188" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#2C2422">Reception Security</text>
