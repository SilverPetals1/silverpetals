<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <linearGradient id="careSilk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EE"/>
      <stop offset="50%" stop-color="#F2E5D3"/>
      <stop offset="100%" stop-color="#E8D7C2"/>
    </linearGradient>

    <linearGradient id="careGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAB0"/>
      <stop offset="50%" stop-color="#D9A83A"/>
      <stop offset="100%" stop-color="#9C6F19"/>
    </linearGradient>

    <filter id="softCareShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4A341E" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="320" rx="14" fill="url(#careSilk)"/>
  <path d="M 0 280 Q 250 170 500 290 T 800 200 L 800 320 L 0 320 Z" fill="#DFC9B2" opacity="0.35"/>
  <path d="M 0 50 Q 260 170 540 40 T 800 120 L 800 0 L 0 0 Z" fill="#FFFFFF" opacity="0.45"/>

  <text x="400" y="38" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="700" fill="#2C2018" letter-spacing="1">Bridal Chandelier Jewelry Care &amp; Preservation</text>
  <text x="400" y="58" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#755E4E">Maintain multi-tier links and shimmering gold luster for generations</text>

  <!-- Step 1: Gentle Cleaning -->
  <g transform="translate(30, 78)" filter="url(#softCareShadow)">
    <rect width="170" height="215" rx="10" fill="#FFFFFF" stroke="#E8DACB" stroke-width="1.2"/>
    <circle cx="85" cy="38" r="20" fill="#FAF5EE" stroke="#D5C2AA"/>
    <!-- Bowl / Water droplet -->
    <path d="M 75 44 C 75 32, 85 24, 85 24 C 85 24, 95 32, 95 44 C 95 50, 90 54, 85 54 C 80 54, 75 50, 75 44 Z" fill="url(#careGold)"/>
    <text x="85" y="86" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="13" font-weight="700" fill="#2C2018">Gentle Cleansing</text>
    <line x1="30" y1="96" x2="140" y2="96" stroke="#EFE5D8" stroke-width="1"/>
    <text x="85" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#8C6826">Warm Water &amp; Suds</text>
    <text x="85" y="136" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Mild dish soap bath</text>
    <text x="85" y="152" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Soft-bristle brush</text>
    <text x="85" y="168" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Clears makeup &amp; oils</text>
    <rect x="25" y="184" width="120" height="18" rx="4" fill="#FAF5EE"/>
    <text x="85" y="196" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#8C6826">Safe Cleansing</text>
  </g>

  <!-- Step 2: Microfiber Polish -->
  <g transform="translate(220, 78)" filter="url(#softCareShadow)">
    <rect width="170" height="215" rx="10" fill="#FFFFFF" stroke="#E8DACB" stroke-width="1.2"/>
    <circle cx="85" cy="38" r="20" fill="#FAF5EE" stroke="#D5C2AA"/>
    <!-- Cloth outline -->
    <rect x="73" y="27" width="24" height="22" rx="4" fill="url(#careGold)"/>
    <text x="85" y="86" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="13" font-weight="700" fill="#2C2018">Microfiber Polish</text>
    <line x1="30" y1="96" x2="140" y2="96" stroke="#EFE5D8" stroke-width="1"/>
    <text x="85" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#8C6826">Lint-Free Buffing</text>
    <text x="85" y="136" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Restore mirror luster</text>
    <text x="85" y="152" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Never paper towels</text>
    <text x="85" y="168" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Prevents micro-scratches</text>
    <rect x="25" y="184" width="120" height="18" rx="4" fill="#FAF5EE"/>
    <text x="85" y="196" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#8C6826">High-Gloss Shine</text>
  </g>

  <!-- Step 3: Velvet Lined Storage -->
  <g transform="translate(410, 78)" filter="url(#softCareShadow)">
    <rect width="170" height="215" rx="10" fill="#FFFFFF" stroke="#E8DACB" stroke-width="1.2"/>
    <circle cx="85" cy="38" r="20" fill="#FAF5EE" stroke="#D5C2AA"/>
    <!-- Box icon -->
    <rect x="72" y="28" width="26" height="20" rx="3" fill="none" stroke="url(#careGold)" stroke-width="2.5"/>
    <line x1="72" y1="36" x2="98" y2="36" stroke="url(#careGold)" stroke-width="1.5"/>
    <text x="85" y="86" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="13" font-weight="700" fill="#2C2018">Individual Storage</text>
    <line x1="30" y1="96" x2="140" y2="96" stroke="#EFE5D8" stroke-width="1"/>
    <text x="85" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#8C6826">Lined Velvet Pouch</text>
    <text x="85" y="136" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Store earrings flat</text>
    <text x="85" y="152" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Separate compartments</text>
    <text x="85" y="168" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Prevents tangled tiers</text>
    <rect x="25" y="184" width="120" height="18" rx="4" fill="#FAF5EE"/>
    <text x="85" y="196" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#8C6826">Anti-Tangle Box</text>
  </g>

  <!-- Step 4: Annual Inspection -->
  <g transform="translate(600, 78)" filter="url(#softCareShadow)">
    <rect width="170" height="215" rx="10" fill="#FFFFFF" stroke="#E8DACB" stroke-width="1.2"/>
    <circle cx="85" cy="38" r="20" fill="#FAF5EE" stroke="#D5C2AA"/>
    <!-- Loupe / checkmark -->
    <circle cx="85" cy="38" r="11" fill="none" stroke="url(#careGold)" stroke-width="2.5"/>
    <line x1="93" y1="46" x2="99" y2="52" stroke="url(#careGold)" stroke-width="3"/>
    <text x="85" y="86" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="13" font-weight="700" fill="#2C2018">Link Inspection</text>
    <line x1="30" y1="96" x2="140" y2="96" stroke="#EFE5D8" stroke-width="1"/>
    <text x="85" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#8C6826">Annual Checkup</text>
    <text x="85" y="136" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Check jump rings</text>
    <text x="85" y="152" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Secure loose prong claws</text>
    <text x="85" y="168" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Preserves heirloom state</text>
    <rect x="25" y="184" width="120" height="18" rx="4" fill="#FAF5EE"/>
    <text x="85" y="196" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#8C6826">Heirloom Grade</text>
  </g>
</svg>
