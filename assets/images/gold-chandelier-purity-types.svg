<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <linearGradient id="puritySilk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EE"/>
      <stop offset="50%" stop-color="#F2E5D3"/>
      <stop offset="100%" stop-color="#E8D7C2"/>
    </linearGradient>

    <!-- 22k Rich Gold -->
    <linearGradient id="gold22k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE07A"/>
      <stop offset="50%" stop-color="#E89F14"/>
      <stop offset="100%" stop-color="#A56300"/>
    </linearGradient>

    <!-- 18k Classic Gold -->
    <linearGradient id="gold18k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA8"/>
      <stop offset="50%" stop-color="#D9A83A"/>
      <stop offset="100%" stop-color="#9C6F19"/>
    </linearGradient>

    <!-- 14k Bright Gold -->
    <linearGradient id="gold14k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CE"/>
      <stop offset="50%" stop-color="#E2BC68"/>
      <stop offset="100%" stop-color="#B28C38"/>
    </linearGradient>

    <!-- Vermeil -->
    <linearGradient id="goldVermeil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D8"/>
      <stop offset="50%" stop-color="#E6C87C"/>
      <stop offset="100%" stop-color="#B5964B"/>
    </linearGradient>

    <filter id="softPurityShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4A341E" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="320" rx="14" fill="url(#puritySilk)"/>
  <path d="M 0 280 Q 250 170 500 290 T 800 200 L 800 320 L 0 320 Z" fill="#DFC9B2" opacity="0.35"/>
  <path d="M 0 50 Q 260 170 540 40 T 800 120 L 800 0 L 0 0 Z" fill="#FFFFFF" opacity="0.45"/>

  <text x="400" y="38" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="700" fill="#2C2018" letter-spacing="1">Bridal Gold Purity &amp; Karat Guide</text>
  <text x="400" y="58" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#755E4E">Compare color richness, durability, and heirloom value for your wedding day</text>

  <!-- 22k Gold -->
  <g transform="translate(30, 78)" filter="url(#softPurityShadow)">
    <rect width="170" height="215" rx="10" fill="#FFFFFF" stroke="#E8DACB" stroke-width="1.2"/>
    <circle cx="85" cy="38" r="20" fill="url(#gold22k)"/>
    <text x="85" y="44" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#FFFFFF">22K</text>
    <text x="85" y="86" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="13" font-weight="700" fill="#2C2018">91.6% Pure Gold</text>
    <line x1="30" y1="96" x2="140" y2="96" stroke="#EFE5D8" stroke-width="1"/>
    <text x="85" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#A56300">Intense Sunlit Hue</text>
    <text x="85" y="136" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Deep yellow-orange</text>
    <text x="85" y="152" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Traditional ceremonies</text>
    <text x="85" y="168" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Prestige &amp; wealth</text>
    <rect x="25" y="184" width="120" height="18" rx="4" fill="#FAF5EE"/>
    <text x="85" y="196" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#A56300">Heritage Royal</text>
  </g>

  <!-- 18k Gold -->
  <g transform="translate(220, 78)" filter="url(#softPurityShadow)">
    <rect width="170" height="215" rx="10" fill="#FFFFFF" stroke="#E8DACB" stroke-width="1.2"/>
    <circle cx="85" cy="38" r="20" fill="url(#gold18k)"/>
    <text x="85" y="44" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#FFFFFF">18K</text>
    <text x="85" y="86" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="13" font-weight="700" fill="#2C2018">75.0% Pure Gold</text>
    <line x1="30" y1="96" x2="140" y2="96" stroke="#EFE5D8" stroke-width="1"/>
    <text x="85" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#8C6826">Rich Warm Butter</text>
    <text x="85" y="136" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Perfect luxury balance</text>
    <text x="85" y="152" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Superior diamond security</text>
    <text x="85" y="168" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Lifelong bridal heirloom</text>
    <rect x="25" y="184" width="120" height="18" rx="4" fill="#FAF5EE"/>
    <text x="85" y="196" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#8C6826">Best Bridal Choice</text>
  </g>

  <!-- 14k Gold -->
  <g transform="translate(410, 78)" filter="url(#softPurityShadow)">
    <rect width="170" height="215" rx="10" fill="#FFFFFF" stroke="#E8DACB" stroke-width="1.2"/>
    <circle cx="85" cy="38" r="20" fill="url(#gold14k)"/>
    <text x="85" y="44" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#FFFFFF">14K</text>
    <text x="85" y="86" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="13" font-weight="700" fill="#2C2018">58.3% Pure Gold</text>
    <line x1="30" y1="96" x2="140" y2="96" stroke="#EFE5D8" stroke-width="1"/>
    <text x="85" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#8C6826">Bright &amp; Resilient</text>
    <text x="85" y="136" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">High scratch resistance</text>
    <text x="85" y="152" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Subtle yellow tone</text>
    <text x="85" y="168" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Versatile for daily wear</text>
    <rect x="25" y="184" width="120" height="18" rx="4" fill="#FAF5EE"/>
    <text x="85" y="196" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#8C6826">Durable &amp; Modern</text>
  </g>

  <!-- Gold Vermeil -->
  <g transform="translate(600, 78)" filter="url(#softPurityShadow)">
    <rect width="170" height="215" rx="10" fill="#FFFFFF" stroke="#E8DACB" stroke-width="1.2"/>
    <circle cx="85" cy="38" r="20" fill="url(#goldVermeil)"/>
    <text x="85" y="44" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="13" font-weight="700" fill="#2C2018">Vermeil</text>
    <text x="85" y="86" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="13" font-weight="700" fill="#2C2018">Gold Over Silver</text>
    <line x1="30" y1="96" x2="140" y2="96" stroke="#EFE5D8" stroke-width="1"/>
    <text x="85" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#8C6826">Accessible Luxury</text>
    <text x="85" y="136" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Thick 18k/14k layer</text>
    <text x="85" y="152" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Budget-savvy brides</text>
    <text x="85" y="168" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#665345">Destination weddings</text>
    <rect x="25" y="184" width="120" height="18" rx="4" fill="#FAF5EE"/>
    <text x="85" y="196" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#8C6826">Budget Friendly</text>
  </g>
</svg>
