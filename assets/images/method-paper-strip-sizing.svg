<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="stepBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF9F6"/>
    </linearGradient>
    <filter id="stepShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="520" rx="16" fill="#F4EFE6"/>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="85" rx="16" fill="#128994"/>
  <text x="40" y="52" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="700" fill="#FFFFFF">Method 1: The Paper Strip Measurement Technique</text>
  <text x="820" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#E2C99D">STEP-BY-STEP</text>

  <!-- 4 Step Cards Grid -->
  <!-- Card 1 -->
  <g transform="translate(40, 115)">
    <rect width="205" height="310" rx="12" fill="url(#stepBg)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#stepShadow)"/>
    <circle cx="35" cy="35" r="18" fill="#128994"/>
    <text x="35" y="41" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">1</text>
    
    <!-- Graphic: Strip & Scissors -->
    <g transform="translate(15, 75)">
      <rect x="20" y="30" width="135" height="18" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
      <line x1="20" y1="39" x2="155" y2="39" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,4"/>
      <!-- Dimension label -->
      <text x="87" y="70" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#CFAA7A">10 cm × 1 cm</text>
    </g>

    <text x="20" y="195" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#2B2D42">Cut Paper Strip</text>
    <text x="20" y="225" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" fill="#64748B" line-height="1.4">
      <tspan x="20" dy="0">Cut a straight strip</tspan>
      <tspan x="20" dy="20">of non-stretchy paper</tspan>
      <tspan x="20" dy="20">approx. 1 cm wide.</tspan>
    </text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(275, 115)">
    <rect width="205" height="310" rx="12" fill="url(#stepBg)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#stepShadow)"/>
    <circle cx="35" cy="35" r="18" fill="#128994"/>
    <text x="35" y="41" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">2</text>
    
    <!-- Graphic: Finger Loop -->
    <g transform="translate(30, 75)">
      <ellipse cx="72" cy="40" rx="55" ry="32" fill="#FAF9F6" stroke="#CFAA7A" stroke-width="3"/>
      <ellipse cx="72" cy="40" rx="38" ry="20" fill="#E2E8F0"/>
      <!-- Paper loop overlay -->
      <path d="M 30,40 C 30,22 114,22 114,40 C 114,58 30,58 30,40" fill="none" stroke="#128994" stroke-width="7" stroke-linecap="round"/>
    </g>

    <text x="20" y="195" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#2B2D42">Wrap Finger</text>
    <text x="20" y="225" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" fill="#64748B">
      <tspan x="20" dy="0">Wrap smoothly around</tspan>
      <tspan x="20" dy="20">the finger base. Keep</tspan>
      <tspan x="20" dy="20">it snug, not choking.</tspan>
    </text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(510, 115)">
    <rect width="205" height="310" rx="12" fill="url(#stepBg)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#stepShadow)"/>
    <circle cx="35" cy="35" r="18" fill="#128994"/>
    <text x="35" y="41" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">3</text>
    
    <!-- Graphic: Mark Intersection -->
    <g transform="translate(30, 75)">
      <rect x="20" y="32" width="105" height="16" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
      <rect x="55" y="25" width="60" height="16" rx="4" fill="#E2E8F0" stroke="#128994" stroke-width="1.5"/>
      <!-- Pen line -->
      <line x1="68" y1="15" x2="68" y2="52" stroke="#E60023" stroke-width="3"/>
      <!-- Pen tip marker -->
      <polygon points="68,15 64,5 72,5" fill="#E60023"/>
    </g>

    <text x="20" y="195" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#2B2D42">Mark Overlap</text>
    <text x="20" y="225" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" fill="#64748B">
      <tspan x="20" dy="0">Use a fine-point pen</tspan>
      <tspan x="20" dy="20">to mark exactly where</tspan>
      <tspan x="20" dy="20">both ends intersect.</tspan>
    </text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(745, 115)">
    <rect width="205" height="310" rx="12" fill="url(#stepBg)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#stepShadow)"/>
    <circle cx="35" cy="35" r="18" fill="#128994"/>
    <text x="35" y="41" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">4</text>
    
    <!-- Graphic: Ruler Measurement -->
    <g transform="translate(15, 75)">
      <!-- Metric ruler -->
      <rect x="10" y="30" width="155" height="26" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5" rx="3"/>
      <line x1="20" y1="30" x2="20" y2="42" stroke="#854D0E" stroke-width="1.5"/>
      <line x1="40" y1="30" x2="40" y2="38" stroke="#854D0E" stroke-width="1"/>
      <line x1="60" y1="30" x2="60" y2="42" stroke="#854D0E" stroke-width="1.5"/>
      <line x1="80" y1="30" x2="80" y2="38" stroke="#854D0E" stroke-width="1"/>
      <line x1="100" y1="30" x2="100" y2="42" stroke="#854D0E" stroke-width="1.5"/>
      <line x1="120" y1="30" x2="120" y2="38" stroke="#854D0E" stroke-width="1"/>
      <line x1="140" y1="30" x2="140" y2="42" stroke="#854D0E" stroke-width="1.5"/>
      <text x="87" y="72" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#128994">54.4 mm (US 7)</text>
    </g>

    <text x="20" y="195" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#2B2D42">Measure on Ruler</text>
    <text x="20" y="225" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" fill="#64748B">
      <tspan x="20" dy="0">Lay strip flat on ruler.</tspan>
      <tspan x="20" dy="20">Measure in mm to find</tspan>
      <tspan x="20" dy="20">inner circumference.</tspan>
    </text>
  </g>

  <!-- Bottom Tip Banner -->
  <g transform="translate(40, 445)">
    <rect width="920" height="50" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="30" y="31" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#E60023">⚠️ PRO TIP:</text>
    <text x="110" y="31" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" fill="#475569">
      Never use sewing thread, yarn, or dental floss. Elastic fibers stretch under tension and cause you to order rings 1–2 sizes too tight!
    </text>
  </g>
</svg>
