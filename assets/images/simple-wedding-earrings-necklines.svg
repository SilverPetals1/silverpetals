<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340">
  <defs>
    <linearGradient id="neckBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="100%" stop-color="#F2EBE0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="340" rx="14" fill="url(#neckBg)"/>
  <text x="400" y="36" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="17" font-weight="700" fill="#2C2422">Bridal Neckline &amp; Simple Earring Match Guide</text>
  <text x="400" y="58" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#7A6E6C">Balancing bodice lines and collar accents with dainty jewelry</text>

  <!-- Card 1: Strapless & Sweetheart -->
  <g transform="translate(25, 78)">
    <rect width="138" height="235" rx="8" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <!-- Silhouette Icon -->
    <path d="M 30 35 Q 69 55 108 35" fill="none" stroke="#8C6826" stroke-width="2.5"/>
    <text x="69" y="85" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#2C2422">Strapless</text>
    <text x="69" y="102" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#2C2422">&amp; Sweetheart</text>
    <text x="69" y="128" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#8C6826">Drops or Studs</text>
    <text x="69" y="155" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#7A6E6C">Bare collarbone</text>
    <text x="69" y="175" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#7A6E6C">Freedom to style</text>
    <text x="69" y="195" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#7A6E6C">Keeps shoulders open</text>
    <text x="69" y="222" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#2C2422">Drop: 0.8"–1.5"</text>
  </g>

  <!-- Card 2: V-Neck & Plunge -->
  <g transform="translate(178, 78)">
    <rect width="138" height="235" rx="8" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <!-- Silhouette Icon -->
    <path d="M 32 32 L 69 58 L 106 32" fill="none" stroke="#8C6826" stroke-width="2.5"/>
    <text x="69" y="85" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#2C2422">V-Neck</text>
    <text x="69" y="102" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#2C2422">&amp; Plunge</text>
    <text x="69" y="128" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#8C6826">Linear Drops</text>
    <text x="69" y="155" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#7A6E6C">Mirrors V-angle</text>
    <text x="69" y="175" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#7A6E6C">Teardrop stones</text>
    <text x="69" y="195" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#7A6E6C">Lengthens neck</text>
    <text x="69" y="222" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#2C2422">Drop: 1.0"–1.8"</text>
  </g>

  <!-- Card 3: Off-Shoulder & Bardot -->
  <g transform="translate(331, 78)">
    <rect width="138" height="235" rx="8" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <!-- Silhouette Icon -->
    <path d="M 28 42 L 110 42" fill="none" stroke="#8C6826" stroke-width="2.5"/>
    <text x="69" y="85" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#2C2422">Off-Shoulder</text>
    <text x="69" y="102" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#2C2422">&amp; Bardot</text>
    <text x="69" y="128" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#8C6826">Huggies / Drops</text>
    <text x="69" y="155" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#7A6E6C">Frames neck contour</text>
    <text x="69" y="175" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#7A6E6C">Delicate balance</text>
    <text x="69" y="195" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#7A6E6C">Romantic grace</text>
    <text x="69" y="222" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#2C2422">Huggies: 12-14mm</text>
  </g>

  <!-- Card 4: High Neck & Illusion -->
  <g transform="translate(484, 78)">
    <rect width="138" height="235" rx="8" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <!-- Silhouette Icon -->
    <path d="M 40 50 Q 69 30 98 50" fill="none" stroke="#8C6826" stroke-width="2.5"/>
    <text x="69" y="85" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#2C2422">High Neck</text>
    <text x="69" y="102" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#2C2422">&amp; Mock Collar</text>
    <text x="69" y="128" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#8C6826">Petite Studs Only</text>
    <text x="69" y="155" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#7A6E6C">Zero fabric clutter</text>
    <text x="69" y="175" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#7A6E6C">No collar snagging</text>
    <text x="69" y="195" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#7A6E6C">Refined clean line</text>
    <text x="69" y="222" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#2C2422">Stud Dia: 6–8mm</text>
  </g>

  <!-- Card 5: Halter & One-Shoulder -->
  <g transform="translate(637, 78)">
    <rect width="138" height="235" rx="8" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <!-- Silhouette Icon -->
    <path d="M 45 55 L 69 30 L 93 55" fill="none" stroke="#8C6826" stroke-width="2.5"/>
    <text x="69" y="85" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#2C2422">Halter &amp;</text>
    <text x="69" y="102" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#2C2422">One-Shoulder</text>
    <text x="69" y="128" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#8C6826">Climbers / Studs</text>
    <text x="69" y="155" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#7A6E6C">Symmetrical balance</text>
    <text x="69" y="175" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#7A6E6C">Draws eyes up</text>
    <text x="69" y="195" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#7A6E6C">Leaves neck open</text>
    <text x="69" y="222" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#2C2422">Botanical crawl</text>
  </g>
</svg>
