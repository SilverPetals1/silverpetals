<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <linearGradient id="faqChBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="100%" stop-color="#F2EBE0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="320" rx="14" fill="url(#faqChBg)"/>
  <text x="400" y="38" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="700" fill="#2C2422">Gold Chandelier FAQ Reference Matrix</text>
  <text x="400" y="60" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#7A6E6C">Quick answers to the top bridal statement earring styling questions</text>

  <!-- Box 1: White Gown -->
  <g transform="translate(30, 85)">
    <rect width="170" height="210" rx="10" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <rect x="20" y="20" width="130" height="24" rx="4" fill="#FAF4EB"/>
    <text x="85" y="36" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#8C6826">PURE WHITE DRESS</text>
    <text x="85" y="75" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">High Contrast</text>
    <text x="85" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Gold adds rich warmth</text>
    <text x="85" y="125" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">and glow against</text>
    <text x="85" y="145" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">bright optical white.</text>
    <text x="85" y="180" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#8C6826">Striking &amp; Warm</text>
  </g>

  <!-- Box 2: Wear a Necklace? -->
  <g transform="translate(220, 85)">
    <rect width="170" height="210" rx="10" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <rect x="20" y="20" width="130" height="24" rx="4" fill="#FAF4EB"/>
    <text x="85" y="36" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#8C6826">WEAR A NECKLACE?</text>
    <text x="85" y="75" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Skip or Go Dainty</text>
    <text x="85" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Earrings are the star.</text>
    <text x="85" y="125" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Bare collarbones create</text>
    <text x="85" y="145" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">clean, modern lines.</text>
    <text x="85" y="180" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#8C6826">Uncluttered Chic</text>
  </g>

  <!-- Box 3: Weight Prevention -->
  <g transform="translate(410, 85)">
    <rect width="170" height="210" rx="10" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <rect x="20" y="20" width="130" height="24" rx="4" fill="#FAF4EB"/>
    <text x="85" y="36" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#8C6826">WEIGHT SOLUTION</text>
    <text x="85" y="75" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Lobe Patches</text>
    <text x="85" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Use wide disc backings</text>
    <text x="85" y="125" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">plus adhesive tape</text>
    <text x="85" y="145" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">to stop lobe fatigue.</text>
    <text x="85" y="180" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#8C6826">Zero Soreness</text>
  </g>

  <!-- Box 4: Modern Appeal -->
  <g transform="translate(600, 85)">
    <rect width="170" height="210" rx="10" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <rect x="20" y="20" width="130" height="24" rx="4" fill="#FAF4EB"/>
    <text x="85" y="36" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#8C6826">MODERN TREND</text>
    <text x="85" y="75" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Couture Romance</text>
    <text x="85" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Sleek fringe and</text>
    <text x="85" y="125" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">pearl tiers are trending</text>
    <text x="85" y="145" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">across 2026 runways.</text>
    <text x="85" y="180" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#8C6826">Runway Favorite</text>
  </g>
</svg>
