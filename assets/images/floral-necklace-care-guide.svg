<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF8"/>
      <stop offset="100%" stop-color="#F2EBE0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="360" rx="16" fill="url(#bgGrad4)" stroke="#E7DDD1" stroke-width="1.5"/>

  <!-- Title -->
  <text x="400" y="42" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="700" fill="#1D2124" letter-spacing="1">STERLING SILVER FLORAL NECKLACE CARE ROUTINE</text>
  <text x="400" y="66" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#6B7280">Preserving Brilliant Luster and Protecting Delicate Petal Filigree for Lifelong Wear</text>

  <!-- Step 1 -->
  <g transform="translate(60, 95)">
    <rect width="210" height="230" rx="12" fill="#FFFFFF" stroke="#E5DCD1" stroke-width="1.5"/>
    <circle cx="105" cy="45" r="22" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <path d="M 105,32 L 105,46 L 115,46" stroke="#92400E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <text x="105" y="95" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#1D2124">Last On, First Off</text>

    <text x="105" y="130" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#4B5563">Put necklace on AFTER</text>
    <text x="105" y="148" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#4B5563">perfume, lotion &amp; spray.</text>
    <text x="105" y="172" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#4B5563">Remove before shower,</text>
    <text x="105" y="190" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#4B5563">swimming or bed.</text>

    <rect x="45" y="210" width="120" height="24" rx="12" fill="#FEF3C7"/>
    <text x="105" y="226" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#92400E">Avoid Chemicals</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(295, 95)">
    <rect width="210" height="230" rx="12" fill="#FFFFFF" stroke="#E5DCD1" stroke-width="1.5"/>
    <circle cx="105" cy="45" r="22" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <path d="M 105,30 C 105,30 115,43 115,48 C 115,53.5 110.5,58 105,58 C 99.5,58 95,53.5 95,48 C 95,43 105,30 105,30 Z" fill="#2563EB"/>

    <text x="105" y="95" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#1D2124">Gentle Soap Soak</text>

    <text x="105" y="130" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#4B5563">Lukewarm water with</text>
    <text x="105" y="148" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#4B5563">mild phosphate-free soap.</text>
    <text x="105" y="172" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#4B5563">Clean petal crevices with</text>
    <text x="105" y="190" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#4B5563">an ultra-soft baby brush.</text>

    <rect x="45" y="210" width="120" height="24" rx="12" fill="#EFF6FF"/>
    <text x="105" y="226" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#1D4ED8">Monthly Bath</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(530, 95)">
    <rect width="210" height="230" rx="12" fill="#FFFFFF" stroke="#E5DCD1" stroke-width="1.5"/>
    <circle cx="105" cy="45" r="22" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <!-- Box / Pouch icon -->
    <rect x="94" y="35" width="22" height="18" rx="3" fill="#16A34A"/>
    <path d="M 91,39 L 105,31 L 119,39" stroke="#15803D" stroke-width="2" fill="none"/>

    <text x="105" y="95" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#1D2124">Anti-Tarnish Storage</text>

    <text x="105" y="130" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#4B5563">Store in an airtight pouch</text>
    <text x="105" y="148" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#4B5563">or lined jewelry box.</text>
    <text x="105" y="172" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#4B5563">Add a silica gel packet</text>
    <text x="105" y="190" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#4B5563">to absorb room humidity.</text>

    <rect x="45" y="210" width="120" height="24" rx="12" fill="#F0FDF4"/>
    <text x="105" y="226" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#15803D">Airtight &amp; Dry</text>
  </g>
</svg>
