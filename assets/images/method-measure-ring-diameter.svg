<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF9F6"/>
    </linearGradient>
    <linearGradient id="silverRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="520" rx="16" fill="#F4EFE6"/>

  <!-- Top Title Bar -->
  <rect x="0" y="0" width="1000" height="85" rx="16" fill="#128994"/>
  <text x="40" y="52" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="700" fill="#FFFFFF">Method 2: Measuring an Existing Ring's Inside Diameter</text>
  <text x="800" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#E2C99D">INTERNAL METRIC</text>

  <!-- Left Card: Correct Measurement Demonstration -->
  <g transform="translate(40, 115)">
    <rect width="440" height="365" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2" filter="url(#softShadow)"/>
    
    <!-- Status Tag -->
    <rect x="25" y="20" width="125" height="28" rx="14" fill="#ECFDF5"/>
    <text x="45" y="39" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#059669">✓ CORRECT WAY</text>

    <!-- Ring on Ruler Visual -->
    <g transform="translate(220, 150)">
      <!-- Metric Ruler -->
      <rect x="-180" y="20" width="360" height="42" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5" rx="4"/>
      <!-- Ruler millimeter tick lines -->
      <line x1="-160" y1="20" x2="-160" y2="35" stroke="#854D0E" stroke-width="2"/>
      <line x1="-120" y1="20" x2="-120" y2="30" stroke="#854D0E" stroke-width="1"/>
      <line x1="-80" y1="20" x2="-80" y2="35" stroke="#854D0E" stroke-width="2"/>
      <line x1="-40" y1="20" x2="-40" y2="30" stroke="#854D0E" stroke-width="1"/>
      <line x1="0" y1="20" x2="0" y2="35" stroke="#854D0E" stroke-width="2"/>
      <line x1="40" y1="20" x2="40" y2="30" stroke="#854D0E" stroke-width="1"/>
      <line x1="80" y1="20" x2="80" y2="35" stroke="#854D0E" stroke-width="2"/>
      <line x1="120" y1="20" x2="120" y2="30" stroke="#854D0E" stroke-width="1"/>
      <line x1="160" y1="20" x2="160" y2="35" stroke="#854D0E" stroke-width="2"/>

      <!-- Ring Outer Circle -->
      <circle cx="0" cy="-20" r="85" fill="none" stroke="url(#silverRing)" stroke-width="18"/>
      <!-- Ring Inner Circle -->
      <circle cx="0" cy="-20" r="76" fill="#FAF9F6"/>

      <!-- Inner Diameter Measurement Arrow -->
      <line x1="-76" y1="-20" x2="76" y2="-20" stroke="#10B981" stroke-width="3"/>
      <polygon points="-76,-20 -66,-25 -66,-15" fill="#10B981"/>
      <polygon points="76,-20 66,-25 66,-15" fill="#10B981"/>

      <!-- Target Dimension Badge -->
      <rect x="-60" y="-40" width="120" height="26" rx="6" fill="#059669"/>
      <text x="0" y="-23" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">17.3 mm (US 7)</text>
    </g>

    <!-- Description -->
    <text x="25" y="295" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#065F46">Measure Inner Edge to Inner Edge Only</text>
    <text x="25" y="322" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" fill="#64748B">
      <tspan x="25" dy="0">Position your ruler across the widest center point.</tspan>
      <tspan x="25" dy="20">Measure only the inside hollow circle.</tspan>
    </text>
  </g>

  <!-- Right Card: Common Mistake to Avoid -->
  <g transform="translate(520, 115)">
    <rect width="440" height="365" rx="12" fill="url(#cardGrad)" stroke="#EF4444" stroke-width="2" filter="url(#softShadow)"/>
    
    <!-- Status Tag -->
    <rect x="25" y="20" width="135" height="28" rx="14" fill="#FEF2F2"/>
    <text x="45" y="39" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#DC2626">✕ COMMON MISTAKE</text>

    <!-- Ring on Ruler (Wrong Measurement) -->
    <g transform="translate(220, 150)">
      <!-- Ruler -->
      <rect x="-180" y="20" width="360" height="42" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5" rx="4"/>
      <line x1="-160" y1="20" x2="-160" y2="35" stroke="#854D0E" stroke-width="2"/>
      <line x1="-80" y1="20" x2="-80" y2="35" stroke="#854D0E" stroke-width="2"/>
      <line x1="0" y1="20" x2="0" y2="35" stroke="#854D0E" stroke-width="2"/>
      <line x1="80" y1="20" x2="80" y2="35" stroke="#854D0E" stroke-width="2"/>
      <line x1="160" y1="20" x2="160" y2="35" stroke="#854D0E" stroke-width="2"/>

      <!-- Ring -->
      <circle cx="0" cy="-20" r="85" fill="none" stroke="url(#silverRing)" stroke-width="18"/>
      <circle cx="0" cy="-20" r="76" fill="#FAF9F6"/>

      <!-- WRONG Outer Measurement Arrow -->
      <line x1="-94" y1="-20" x2="94" y2="-20" stroke="#DC2626" stroke-width="3" stroke-dasharray="4,4"/>
      <polygon points="-94,-20 -84,-25 -84,-15" fill="#DC2626"/>
      <polygon points="94,-20 84,-25 84,-15" fill="#DC2626"/>

      <!-- Wrong Dimension Badge -->
      <rect x="-70" y="-40" width="140" height="26" rx="6" fill="#DC2626"/>
      <text x="0" y="-23" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">20.3 mm (US 10.5)</text>
    </g>

    <!-- Description -->
    <text x="25" y="295" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#991B1B">Do NOT Include Metal Rim Thickness</text>
    <text x="25" y="322" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" fill="#64748B">
      <tspan x="25" dy="0">Including outer metal edges (+1.5 mm on each side)</tspan>
      <tspan x="25" dy="20">will distort your ring size by 2–3 full sizes larger!</tspan>
    </text>
  </g>
</svg>
