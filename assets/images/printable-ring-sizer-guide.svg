<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF9F6"/>
    </linearGradient>
    <filter id="softShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" rx="16" fill="#F4EFE6"/>

  <!-- Top Title Bar -->
  <rect x="0" y="0" width="1000" height="85" rx="16" fill="#128994"/>
  <text x="40" y="52" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="700" fill="#FFFFFF">Method 3: Printable Template &amp; Plastic Multi-Sizer Belt</text>
  <text x="815" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#E2C99D">SCALE TOOLS</text>

  <!-- Left Card: Printable Circle Overlays -->
  <g transform="translate(40, 115)">
    <rect width="440" height="365" rx="12" fill="url(#cardGrad2)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow2)"/>
    
    <text x="30" y="45" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="700" fill="#2B2D42">Printable Circle Overlays</text>
    <text x="30" y="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" fill="#64748B">Place your existing ring over circles to find exact match.</text>

    <!-- Visual of Circle Overlays -->
    <g transform="translate(50, 100)">
      <!-- Circle 1: Size 5 -->
      <circle cx="50" cy="50" r="38" fill="none" stroke="#CBD5E1" stroke-width="2"/>
      <text x="50" y="54" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#64748B">US 5</text>
      <text x="50" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#94A3B8">15.7 mm</text>

      <!-- Circle 2: Size 6 -->
      <circle cx="160" cy="50" r="41" fill="none" stroke="#CBD5E1" stroke-width="2"/>
      <text x="160" y="54" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#64748B">US 6</text>
      <text x="160" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#94A3B8">16.5 mm</text>

      <!-- Circle 3: Size 7 (Match) -->
      <circle cx="280" cy="50" r="44" fill="#F0FDF4" stroke="#10B981" stroke-width="3"/>
      <!-- Ring placed on top of circle 7 -->
      <circle cx="280" cy="50" r="44" fill="none" stroke="#CFAA7A" stroke-width="6"/>
      <text x="280" y="54" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#059669">US 7 ✓</text>
      <text x="280" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#059669">17.3 mm</text>
    </g>

    <!-- Calibration Alert Box -->
    <g transform="translate(25, 235)">
      <rect width="390" height="95" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
      <text x="18" y="28" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#B45309">⚠️ Critical Printer Calibration Rule:</text>
      <text x="18" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#92400E">
        <tspan x="18" dy="0">Always set Print Scaling to "100%" or "Actual Size".</tspan>
        <tspan x="18" dy="18">Do not select "Fit to Page" (causes 5% shrinkage error).</tspan>
      </text>
    </g>
  </g>

  <!-- Right Card: Plastic Multi-Sizer Belt Gauge -->
  <g transform="translate(520, 115)">
    <rect width="440" height="365" rx="12" fill="url(#cardGrad2)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow2)"/>
    
    <text x="30" y="45" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="700" fill="#2B2D42">Plastic Multi-Sizer Belt</text>
    <text x="30" y="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" fill="#64748B">Reusable gauge belt with magnifying pointer buckle.</text>

    <!-- Multi-Sizer Belt Visual -->
    <g transform="translate(30, 110)">
      <!-- Belt Strap -->
      <rect x="20" y="30" width="340" height="24" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
      <!-- Sizing notches -->
      <line x1="60" y1="30" x2="60" y2="40" stroke="#64748B" stroke-width="1.5"/>
      <line x1="100" y1="30" x2="100" y2="40" stroke="#64748B" stroke-width="1.5"/>
      <line x1="140" y1="30" x2="140" y2="40" stroke="#64748B" stroke-width="1.5"/>
      <line x1="180" y1="30" x2="180" y2="40" stroke="#64748B" stroke-width="1.5"/>
      <line x1="220" y1="30" x2="220" y2="40" stroke="#64748B" stroke-width="1.5"/>
      <line x1="260" y1="30" x2="260" y2="40" stroke="#64748B" stroke-width="1.5"/>
      <line x1="300" y1="30" x2="300" y2="40" stroke="#64748B" stroke-width="1.5"/>

      <!-- Magnifying Buckle -->
      <rect x="160" y="18" width="46" height="48" rx="8" fill="#128994" stroke="#0D5A61" stroke-width="2"/>
      <circle cx="183" cy="42" r="14" fill="#FFFFFF" fill-opacity="0.95"/>
      <!-- Arrow Pointer -->
      <polygon points="183,28 179,35 187,35" fill="#E60023"/>
      <text x="183" y="47" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#128994">7</text>
    </g>

    <!-- Knuckle Slide Test Box -->
    <g transform="translate(25, 235)">
      <rect width="390" height="95" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
      <text x="18" y="28" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#047857">✓ The Crucial Knuckle Slide Test:</text>
      <text x="18" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#065F46">
        <tspan x="18" dy="0">Once the belt is adjusted at the base of your finger,</tspan>
        <tspan x="18" dy="18">slide it off and on over your knuckle. It must pass</tspan>
        <tspan x="18" dy="18">smoothly with only gentle resistance.</tspan>
      </text>
    </g>
  </g>
</svg>
