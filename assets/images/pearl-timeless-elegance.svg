    <circle cx="36" cy="135" r="5" fill="#C5A059"/>
    <text x="52" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#3D3230">Timeless Heirloom Quality</text>
    <text x="52" y="158" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#7A6E6C">Never trends out; cherished across generations</text>
    <circle cx="36" cy="190" r="5" fill="#C5A059"/>
    <text x="52" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#3D3230">Harmonizes with Bridal Silk &amp; Lace</text>
    <text x="52" y="213" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#7A6E6C">Soft ivory overtones complement all gown fabrics</text>
