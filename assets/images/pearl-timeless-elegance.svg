<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="bgP1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="100%" stop-color="#F4ECE1"/>
    </linearGradient>
    <radialGradient id="pearlShine" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FFFDF8"/>
      <stop offset="60%" stop-color="#F2EAE0"/>
      <stop offset="85%" stop-color="#E2D4C4"/>
      <stop offset="100%" stop-color="#CBB7A2"/>
    </radialGradient>
    <linearGradient id="silverGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E6ECF0"/>
      <stop offset="80%" stop-color="#B8C4CC"/>
      <stop offset="100%" stop-color="#8E9AA4"/>
    </linearGradient>
    <filter id="pShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3A2E2C" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="800" height="360" rx="14" fill="url(#bgP1)"/>
  <rect x="16" y="16" width="768" height="328" rx="10" fill="none" stroke="#E2D5C7" stroke-width="1.5" stroke-dasharray="5,5"/>
  <g transform="translate(190, 180)" filter="url(#pShadow)">
    <path d="M 0 -100 C -25 -60, -35 -20, 0 20 C 35 -20, 25 -60, 0 -100 Z" fill="none" stroke="url(#silverGleam)" stroke-width="6"/>
    <circle cx="0" cy="45" r="48" fill="url(#pearlShine)"/>
    <ellipse cx="-16" cy="28" rx="14" ry="9" fill="#FFFFFF" opacity="0.85" transform="rotate(-25 -16 28)"/>
    <circle cx="0" cy="-95" r="8" fill="url(#silverGleam)"/>
    <circle cx="0" cy="-95" r="3" fill="#FFFFFF"/>
  </g>
  <g transform="translate(410, 60)">
    <rect width="340" height="240" rx="10" fill="#FFFFFF" stroke="#EAE0D5" stroke-width="1" filter="url(#pShadow)"/>
    <text x="24" y="38" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="700" fill="#2C2422">Why Brides Choose Pearls</text>
    <line x1="24" y1="50" x2="316" y2="50" stroke="#F0E5D8" stroke-width="1.5"/>
    <circle cx="36" cy="80" r="5" fill="#C5A059"/>
    <text x="52" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#3D3230">Soft Radiant Glow</text>
