<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF8"/>
      <stop offset="100%" stop-color="#F2EBE0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="380" rx="16" fill="url(#bgGrad2)" stroke="#E7DDD1" stroke-width="1.5"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="700" fill="#1D2124" letter-spacing="1">NECKLACE CHAIN LENGTH &amp; PLACEMENT GUIDE</text>
  <text x="400" y="64" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#6B7280">How Different Chain Lengths Position Your Sterling Silver Floral Pendant</text>

  <!-- Row 1: 16 Inch (Choker / Collarbone) -->
  <g transform="translate(50, 90)">
    <rect width="700" height="75" rx="10" fill="#FFFFFF" stroke="#E2D5C7" stroke-width="1.5"/>
    <rect x="15" y="15" width="90" height="45" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="60" y="38" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="700" fill="#8C6826">16 INCH</text>
    <text x="60" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#64748B">40 CM</text>

    <text x="130" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#1D2124">Collarbone / Clavicle Fit</text>
    <text x="130" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#4B5563">Rests right at the hollow of the throat. Ideal for V-necks, scoop tops, and open-collar blouses.</text>

    <rect x="575" y="24" width="105" height="28" rx="14" fill="#FEF3C7"/>
    <text x="627" y="42" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#92400E">Chic &amp; Dainty</text>
  </g>

  <!-- Row 2: 18 Inch (Princess / Universal Standard) -->
  <g transform="translate(50, 180)">
    <rect width="700" height="85" rx="10" fill="#FFFFFF" stroke="#8C6826" stroke-width="2"/>
    <rect x="15" y="20" width="90" height="45" rx="6" fill="#FDF8F0" stroke="#E0C9A6" stroke-width="1"/>
    <text x="60" y="43" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="700" fill="#8C6826">18 INCH</text>
    <text x="60" y="57" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#64748B">45 CM</text>

    <text x="130" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#1D2124">Princess Length (Universally Flattering Standard)</text>
    <text x="130" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#4B5563">Rests just below the collarbone. The most versatile length that suits 90% of necklines and sweaters.</text>

    <rect x="565" y="28" width="120" height="28" rx="14" fill="#DCFCE7"/>
    <text x="625" y="46" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#15803D">★ Recommended</text>
  </g>

  <!-- Row 3: 20 Inch (Matinee / Layering) -->
  <g transform="translate(50, 280)">
    <rect width="700" height="75" rx="10" fill="#FFFFFF" stroke="#E2D5C7" stroke-width="1.5"/>
    <rect x="15" y="15" width="90" height="45" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="60" y="38" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="700" fill="#8C6826">20 INCH</text>
    <text x="60" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#64748B">50 CM</text>

    <text x="130" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#1D2124">Matinee / Statement Placement</text>
    <text x="130" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#4B5563">Sits comfortably over high crewnecks, turtlenecks, or acts as the longer base in layered chains.</text>

    <rect x="575" y="24" width="105" height="28" rx="14" fill="#F1F5F9"/>
    <text x="627" y="42" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#475569">Layering Base</text>
  </g>
</svg>
