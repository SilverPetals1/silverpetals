<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" class="silverpetals-logo-svg">
  <defs>
    <linearGradient id="warmGoldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8CCA4" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#8C6826" />
    </linearGradient>
    <linearGradient id="softPetalSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6EF" />
      <stop offset="50%" stop-color="#E8DDD0" />
      <stop offset="100%" stop-color="#C5B7A8" />
    </linearGradient>
  </defs>

  <!-- Elegant Botanical Petal Blossom Emblem -->
  <g transform="translate(6, 4)">
    <!-- Outer Silver Petals -->
    <path d="M26 6 C23 16, 29 23, 26 28 C23 23, 29 16, 26 6 Z" fill="url(#softPetalSilver)" stroke="#C5A059" stroke-width="0.75" />
    <path d="M26 28 C36 25, 43 31, 48 28 C43 25, 36 31, 26 28 Z" fill="url(#softPetalSilver)" stroke="#C5A059" stroke-width="0.75" />
    <path d="M26 28 C29 38, 23 45, 26 50 C29 45, 23 38, 26 28 Z" fill="url(#softPetalSilver)" stroke="#C5A059" stroke-width="0.75" />
    <path d="M26 28 C16 31, 9 25, 4 28 C9 31, 16 25, 26 28 Z" fill="url(#softPetalSilver)" stroke="#C5A059" stroke-width="0.75" />
    
    <!-- Rotated Gold Accents -->
    <g transform="rotate(45, 26, 28)">
      <path d="M26 10 C23 18, 29 22, 26 28 C23 22, 29 18, 26 10 Z" fill="url(#warmGoldGradient)" opacity="0.95" />
      <path d="M26 28 C34 25, 38 29, 42 28 C38 29, 34 25, 26 28 Z" fill="url(#warmGoldGradient)" opacity="0.95" />
      <path d="M26 28 C29 36, 25 40, 26 46 C25 40, 29 36, 26 28 Z" fill="url(#warmGoldGradient)" opacity="0.95" />
      <path d="M26 28 C18 29, 14 25, 10 28 C14 25, 18 29, 26 28 Z" fill="url(#warmGoldGradient)" opacity="0.95" />
    </g>

    <!-- Center Sparkling Core -->
    <circle cx="26" cy="28" r="4.2" fill="#FAF8F3" stroke="url(#warmGoldGradient)" stroke-width="1.2" />
    <polygon points="26,24.5 27.2,27 29.5,28 27.2,29 26,31.5 24.8,29 22.5,28 24.8,27" fill="#C5A059" />
  </g>

  <!-- Brand Wordmark: SilverPetals in Serif Editorial Typography -->
  <text x="68" y="36" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="31" font-weight="600" letter-spacing="0.04em" fill="#2A211B">
    Silver<tspan fill="#8C6826" font-weight="600">Petals</tspan>
  </text>

  <!-- Tagline: Luxury Jewelry Editorial -->
  <text x="70" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.32em" fill="#8C6826">
    FINE JEWELRY &amp; EDITORIAL
  </text>
  
  <!-- Subtle Muted Gold Diamond Sparkle -->
  <path d="M285 20 Q287 23 290 24 Q287 25 285 28 Q283 25 280 24 Q283 23 285 20 Z" fill="#C5A059" />
</svg>
