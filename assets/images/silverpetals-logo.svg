<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" class="silverpetals-logo-svg">
  <defs>
    <linearGradient id="silverShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="30%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="goldPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#CFAA7A" />
      <stop offset="100%" stop-color="#926D35" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Flower / Silver Petal Emblem -->
  <g transform="translate(6, 4)">
    <!-- Outer Delicate Floral Petals (5 petals arranged around center) -->
    <path d="M26 6 C23 16, 29 23, 26 28 C23 23, 29 16, 26 6 Z" fill="url(#silverShine)" stroke="#A0AEC0" stroke-width="0.75" />
    <path d="M26 28 C36 25, 43 31, 48 28 C43 25, 36 31, 26 28 Z" fill="url(#silverShine)" stroke="#A0AEC0" stroke-width="0.75" />
    <path d="M26 28 C29 38, 23 45, 26 50 C29 45, 23 38, 26 28 Z" fill="url(#silverShine)" stroke="#A0AEC0" stroke-width="0.75" />
    <path d="M26 28 C16 31, 9 25, 4 28 C9 31, 16 25, 26 28 Z" fill="url(#silverShine)" stroke="#A0AEC0" stroke-width="0.75" />
    
    <!-- Rotated 45 deg Petals for Full Blossom -->
    <g transform="rotate(45, 26, 28)">
      <path d="M26 10 C23 18, 29 22, 26 28 C23 22, 29 18, 26 10 Z" fill="url(#goldPetal)" opacity="0.9" />
      <path d="M26 28 C34 25, 38 29, 42 28 C38 29, 34 25, 26 28 Z" fill="url(#goldPetal)" opacity="0.9" />
      <path d="M26 28 C29 36, 25 40, 26 46 C25 40, 29 36, 26 28 Z" fill="url(#goldPetal)" opacity="0.9" />
      <path d="M26 28 C18 29, 14 25, 10 28 C14 25, 18 29, 26 28 Z" fill="url(#goldPetal)" opacity="0.9" />
    </g>

    <!-- Center Sparkling Diamond / Gem Core -->
    <circle cx="26" cy="28" r="4.2" fill="#FFFFFF" stroke="url(#goldPetal)" stroke-width="1.2" />
    <polygon points="26,24.5 27.2,27 29.5,28 27.2,29 26,31.5 24.8,29 22.5,28 24.8,27" fill="#CFAA7A" filter="url(#subtleGlow)" />
  </g>

  <!-- Brand Wordmark: SilverPetals -->
  <text x="68" y="35" font-family="'Josefin Sans', 'Playfair Display', Georgia, serif" font-size="28" font-weight="600" letter-spacing="-0.01em" fill="#1E2329">
    Silver<tspan fill="#CFAA7A" font-weight="700">Petals</tspan>
  </text>

  <!-- Tagline: Fine Sterling Jewelry -->
  <text x="70" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.28em" fill="#718096">
    FINE STERLING JEWELRY
  </text>
  
  <!-- Tiny Luxury Sparkle -->
  <path d="M260 20 Q262 23 265 24 Q262 25 260 28 Q258 25 255 24 Q258 23 260 20 Z" fill="#CFAA7A" />
</svg>
