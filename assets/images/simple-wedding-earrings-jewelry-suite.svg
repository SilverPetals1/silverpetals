<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330">
  <defs>
    <linearGradient id="suiteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="100%" stop-color="#F2EBE0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="330" rx="14" fill="url(#suiteBg)"/>
  <text x="400" y="38" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="700" fill="#2C2422">Bridal Jewelry Harmony: The 3 Golden Balance Rules</text>
  <text x="400" y="60" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#7A6E6C">How to pair earrings seamlessly with necklaces, bracelets, and rings</text>

  <!-- 1. The Focal Rule -->
  <g transform="translate(30, 85)">
    <rect width="225" height="215" rx="10" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <!-- Icon Focal Star -->
    <circle cx="112" cy="46" r="22" fill="#FAF4EB" stroke="#C5A059" stroke-width="1.5"/>
    <text x="112" y="53" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16">⭐</text>
    <text x="112" y="94" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Rule 1: One Hero Piece</text>
    <text x="112" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8C6826">Avoid Visual Competition</text>
    <text x="112" y="142" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Statement necklace? Pick studs.</text>
    <text x="112" y="162" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">No necklace? Wear drops.</text>
    <text x="112" y="188" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#2C2422">Clear Focal Anchor</text>
  </g>

  <!-- 2. Consistent Metals -->
  <g transform="translate(285, 85)">
    <rect width="225" height="215" rx="10" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <!-- Interlocking rings -->
    <circle cx="104" cy="46" r="16" fill="none" stroke="#C5A059" stroke-width="3"/>
    <circle cx="120" cy="46" r="16" fill="none" stroke="#C5A059" stroke-width="3"/>
    <text x="112" y="94" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Rule 2: Unified Metal Tone</text>
    <text x="112" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8C6826">Silver, Gold, or Rose</text>
    <text x="112" y="142" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Match earrings to headpiece</text>
    <text x="112" y="162" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Coordinates with ring band</text>
    <text x="112" y="188" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#2C2422">Polished Cohesion</text>
  </g>

  <!-- 3. Scale Proportions -->
  <g transform="translate(540, 85)">
    <rect width="225" height="215" rx="10" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <!-- Scale icon -->
    <circle cx="112" cy="46" r="22" fill="#FAF4EB" stroke="#C5A059" stroke-width="1.5"/>
    <line x1="95" y1="46" x2="129" y2="46" stroke="#8C6826" stroke-width="2.5"/>
    <circle cx="98" cy="52" r="5" fill="#8C6826"/>
    <circle cx="126" cy="52" r="5" fill="#8C6826"/>
    <text x="112" y="94" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Rule 3: Scale Proportions</text>
    <text x="112" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8C6826">Delicate with Delicate</text>
    <text x="112" y="142" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Fine wire chains with dainty studs</text>
    <text x="112" y="162" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Slim tennis bracelets</text>
    <text x="112" y="188" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#2C2422">Effortless Elegance</text>
  </g>
</svg>
