<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F5" />
      <stop offset="50%" stop-color="#F3ECE2" />
      <stop offset="100%" stop-color="#EAE0D2" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="35%" stop-color="#E5C388" />
      <stop offset="70%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#8C6826" />
    </linearGradient>
    <linearGradient id="platGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E6EA" />
      <stop offset="75%" stop-color="#B8C0C8" />
      <stop offset="100%" stop-color="#8A94A0" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#F9F6F0" stop-opacity="0.95" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4A3E3D" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle Decorative Border -->
  <rect x="25" y="25" width="1150" height="580" fill="none" stroke="#D8C8B4" stroke-width="1.5" stroke-dasharray="6,4" rx="16" />

  <!-- Brand & Header -->
  <g transform="translate(60, 55)">
    <text x="0" y="24" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="14" font-weight="700" letter-spacing="4" fill="#8C6826">SILVERPETALS™ FINE JEWELRY • EXPERT BRIDAL CARE</text>
    <text x="0" y="68" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="38" font-weight="700" fill="#2C2422">Wedding Ring Care Guide</text>
    <text x="0" y="100" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16" fill="#6A5F5D">Safe At-Home Cleaning, Metal Metallurgy, Gemstone Safety &amp; Lifetime Maintenance</text>
  </g>

  <!-- Central Illustrated Cards: 4 Core Pillars of Ring Longevity -->
  <!-- Pillar 1: Soak -->
  <g transform="translate(60, 185)" filter="url(#cardShadow)">
    <rect width="250" height="350" rx="12" fill="url(#cardGrad)" stroke="#EADCCB" stroke-width="1" />
    <circle cx="125" cy="70" r="38" fill="#F4ECE1" stroke="#D4BEA2" stroke-width="1.5" />
    <!-- Water Bowl Icon -->
    <path d="M 100 68 C 100 85, 150 85, 150 68 Z" fill="#C5A059" opacity="0.8" />
    <path d="M 96 64 C 110 60, 140 60, 154 64" fill="none" stroke="#8C6826" stroke-width="2" stroke-linecap="round" />
    <!-- Bubbles -->
    <circle cx="120" cy="54" r="3" fill="#8C6826" opacity="0.6" />
    <circle cx="130" cy="50" r="4" fill="#8C6826" opacity="0.6" />
    <text x="125" y="145" text-anchor="middle" font-family="'Cinzel', serif" font-size="18" font-weight="700" fill="#2C2422">1. Warm Soak</text>
    <text x="125" y="175" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#C5A059">WEEKLY RITUAL</text>
    <text x="125" y="210" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#6A5F5D">Warm water + mild</text>
    <text x="125" y="230" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#6A5F5D">dishwashing soap.</text>
    <text x="125" y="260" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#8A7E7C">15-minute soak dissolves</text>
    <text x="125" y="280" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#8A7E7C">oils behind stones safely.</text>
    <rect x="35" y="305" width="180" height="24" rx="4" fill="#F4ECE1" />
    <text x="125" y="321" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8C6826">NO HARSH CHEMICALS</text>
  </g>

  <!-- Pillar 2: Soft Brush -->
  <g transform="translate(335, 185)" filter="url(#cardShadow)">
    <rect width="250" height="350" rx="12" fill="url(#cardGrad)" stroke="#EADCCB" stroke-width="1" />
    <circle cx="125" cy="70" r="38" fill="#F4ECE1" stroke="#D4BEA2" stroke-width="1.5" />
    <!-- Soft Brush Icon -->
    <path d="M 112 55 L 138 55 L 132 82 L 118 82 Z" fill="#C5A059" opacity="0.85" />
    <line x1="114" y1="86" x2="114" y2="92" stroke="#8C6826" stroke-width="1.5" />
    <line x1="119" y1="86" x2="119" y2="92" stroke="#8C6826" stroke-width="1.5" />
    <line x1="125" y1="86" x2="125" y2="92" stroke="#8C6826" stroke-width="1.5" />
    <line x1="131" y1="86" x2="131" y2="92" stroke="#8C6826" stroke-width="1.5" />
    <line x1="136" y1="86" x2="136" y2="92" stroke="#8C6826" stroke-width="1.5" />
    <text x="125" y="145" text-anchor="middle" font-family="'Cinzel', serif" font-size="18" font-weight="700" fill="#2C2422">2. Soft Clean</text>
    <text x="125" y="175" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#C5A059">MICRO-BRISTLES</text>
    <text x="125" y="210" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#6A5F5D">Baby toothbrush or</text>
    <text x="125" y="230" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#6A5F5D">soft cosmetic wand.</text>
    <text x="125" y="260" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#8A7E7C">Gentle brush sweeps</text>
    <text x="125" y="280" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#8A7E7C">under galleries &amp; prongs.</text>
    <rect x="35" y="305" width="180" height="24" rx="4" fill="#F4ECE1" />
    <text x="125" y="321" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8C6826">PLUG DRAIN FIRST</text>
  </g>

  <!-- Pillar 3: Mindful Wear -->
  <g transform="translate(610, 185)" filter="url(#cardShadow)">
    <rect width="250" height="350" rx="12" fill="url(#cardGrad)" stroke="#EADCCB" stroke-width="1" />
    <circle cx="125" cy="70" r="38" fill="#F4ECE1" stroke="#D4BEA2" stroke-width="1.5" />
    <!-- Shield / Protection Icon -->
    <path d="M 125 50 L 145 58 L 145 74 C 145 86, 125 94, 125 94 C 125 94, 105 86, 105 74 L 105 58 Z" fill="url(#goldGrad)" />
    <path d="M 120 70 L 124 74 L 132 64" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="125" y="145" text-anchor="middle" font-family="'Cinzel', serif" font-size="18" font-weight="700" fill="#2C2422">3. Mindful Wear</text>
    <text x="125" y="175" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#C5A059">DAILY HABITS</text>
    <text x="125" y="210" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#6A5F5D">Remove at the gym,</text>
    <text x="125" y="230" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#6A5F5D">pool, and during sleep.</text>
    <text x="125" y="260" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#8A7E7C">Prevents bent shanks</text>
    <text x="125" y="280" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#8A7E7C">and chlorine corrosion.</text>
    <rect x="35" y="305" width="180" height="24" rx="4" fill="#F4ECE1" />
    <text x="125" y="321" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8C6826">LAST ON • FIRST OFF</text>
  </g>

  <!-- Pillar 4: Bench Inspection -->
  <g transform="translate(885, 185)" filter="url(#cardShadow)">
    <rect width="250" height="350" rx="12" fill="url(#cardGrad)" stroke="#EADCCB" stroke-width="1" />
    <circle cx="125" cy="70" r="38" fill="#F4ECE1" stroke="#D4BEA2" stroke-width="1.5" />
    <!-- Loupe / Diamond Icon -->
    <path d="M 125 52 L 138 64 L 125 86 L 112 64 Z" fill="url(#platGrad)" />
    <path d="M 116 64 L 134 64" stroke="#4A3E3D" stroke-width="1" />
    <path d="M 121 52 L 125 64 L 129 52" fill="none" stroke="#4A3E3D" stroke-width="1" />
    <circle cx="138" cy="80" r="10" fill="none" stroke="#8C6826" stroke-width="2.5" />
    <line x1="145" y1="87" x2="153" y2="95" stroke="#8C6826" stroke-width="3" stroke-linecap="round" />
    <text x="125" y="145" text-anchor="middle" font-family="'Cinzel', serif" font-size="18" font-weight="700" fill="#2C2422">4. Annual Check</text>
    <text x="125" y="175" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#C5A059">BENCH JEWELER</text>
    <text x="125" y="210" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#6A5F5D">Yearly prong check,</text>
    <text x="125" y="230" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#6A5F5D">ultrasonic &amp; rhodium.</text>
    <text x="125" y="260" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#8A7E7C">Catches shifted prongs</text>
    <text x="125" y="280" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#8A7E7C">before stones are lost.</text>
    <rect x="35" y="305" width="180" height="24" rx="4" fill="#F4ECE1" />
    <text x="125" y="321" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8C6826">ANNUAL PEACE OF MIND</text>
  </g>

  <!-- Bottom Subtitle / Guarantee -->
  <text x="600" y="585" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#8C6826" letter-spacing="1">SILVERPETALS.ONLINE • HANDCRAFTED FINE BRIDAL JEWELRY &amp; LIFETIME CARE</text>
</svg>
