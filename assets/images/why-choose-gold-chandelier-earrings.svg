<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <!-- Realistic Luxury Warm Silk & Gold Gradient Backdrop -->
    <linearGradient id="silkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EE"/>
      <stop offset="40%" stop-color="#F2E6D4"/>
      <stop offset="75%" stop-color="#EADBCC"/>
      <stop offset="100%" stop-color="#DFCFBD"/>
    </linearGradient>

    <!-- Warm Golden Hour Glow -->
    <radialGradient id="sunGlow" cx="20%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#FFFDF7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F7EADB" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8D5C0" stop-opacity="0"/>
    </radialGradient>

    <!-- Matte Brushed Gold Gradient -->
    <linearGradient id="brushedGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB0"/>
      <stop offset="35%" stop-color="#E5BF62"/>
      <stop offset="70%" stop-color="#BA9235"/>
      <stop offset="100%" stop-color="#8E691A"/>
    </linearGradient>

    <!-- Pearl Lustrous Gradient -->
    <radialGradient id="pearlShine" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FDF9F2"/>
      <stop offset="85%" stop-color="#EFE3D3"/>
      <stop offset="100%" stop-color="#D2BAA2"/>
    </radialGradient>

    <!-- Deep Organic Shadow -->
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="6" dy="12" stdDeviation="10" flood-color="#4A3B2C" flood-opacity="0.25"/>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#5C4836" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 1. Background Base -->
  <rect width="800" height="360" rx="14" fill="url(#silkBg)"/>
  <rect width="800" height="360" fill="url(#sunGlow)"/>

  <!-- Soft Woven Silk Folds -->
  <path d="M 0 320 Q 240 180 480 340 T 800 200 L 800 360 L 0 360 Z" fill="#D3BEA8" opacity="0.25"/>
  <path d="M 0 80 Q 260 220 520 60 T 800 160 L 800 0 L 0 0 Z" fill="#FFFFFF" opacity="0.35"/>

  <!-- 2. Left Side: Beautiful Botanical Chandelier Earring (Styled exactly like the uploaded image) -->
  <g transform="translate(160, 180)" filter="url(#softShadow)">
    <!-- Top 5-Petal Flower Stud -->
    <g transform="translate(0, -95)">
      <!-- 5 Petals -->
      <path d="M 0 0 C -10 -15, -5 -25, 0 -28 C 5 -25, 10 -15, 0 0 Z" fill="url(#brushedGold)" stroke="#A07923" stroke-width="0.8"/>
      <path d="M 0 0 C -10 -15, -5 -25, 0 -28 C 5 -25, 10 -15, 0 0 Z" fill="url(#brushedGold)" stroke="#A07923" stroke-width="0.8" transform="rotate(72)"/>
      <path d="M 0 0 C -10 -15, -5 -25, 0 -28 C 5 -25, 10 -15, 0 0 Z" fill="url(#brushedGold)" stroke="#A07923" stroke-width="0.8" transform="rotate(144)"/>
      <path d="M 0 0 C -10 -15, -5 -25, 0 -28 C 5 -25, 10 -15, 0 0 Z" fill="url(#brushedGold)" stroke="#A07923" stroke-width="0.8" transform="rotate(216)"/>
      <path d="M 0 0 C -10 -15, -5 -25, 0 -28 C 5 -25, 10 -15, 0 0 Z" fill="url(#brushedGold)" stroke="#A07923" stroke-width="0.8" transform="rotate(288)"/>
      <!-- Center Diamond -->
      <circle cx="0" cy="0" r="4.5" fill="#FFFFFF" stroke="#C5A059" stroke-width="1"/>
    </g>

    <!-- Connecting Gold Stems & Marquise Diamonds -->
    <path d="M 0 -68 Q 8 -40, 0 -10" fill="none" stroke="url(#brushedGold)" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="6" cy="-52" rx="3.5" ry="7" fill="#FFFFFF" stroke="#A07923" stroke-width="0.8" transform="rotate(30 6 -52)"/>
    <ellipse cx="-6" cy="-40" rx="3" ry="6" fill="#FFFFFF" stroke="#A07923" stroke-width="0.8" transform="rotate(-30 -6 -40)"/>

    <!-- Large Center Layered Rose Flower -->
    <g transform="translate(0, 10)">
      <!-- Outer Petals Layer -->
      <path d="M 0 0 C -22 -30, -12 -55, 0 -60 C 12 -55, 22 -30, 0 0 Z" fill="url(#brushedGold)" stroke="#9E761C" stroke-width="0.8"/>
      <path d="M 0 0 C -22 -30, -12 -55, 0 -60 C 12 -55, 22 -30, 0 0 Z" fill="url(#brushedGold)" stroke="#9E761C" stroke-width="0.8" transform="rotate(60)"/>
      <path d="M 0 0 C -22 -30, -12 -55, 0 -60 C 12 -55, 22 -30, 0 0 Z" fill="url(#brushedGold)" stroke="#9E761C" stroke-width="0.8" transform="rotate(120)"/>
      <path d="M 0 0 C -22 -30, -12 -55, 0 -60 C 12 -55, 22 -30, 0 0 Z" fill="url(#brushedGold)" stroke="#9E761C" stroke-width="0.8" transform="rotate(180)"/>
      <path d="M 0 0 C -22 -30, -12 -55, 0 -60 C 12 -55, 22 -30, 0 0 Z" fill="url(#brushedGold)" stroke="#9E761C" stroke-width="0.8" transform="rotate(240)"/>
      <path d="M 0 0 C -22 -30, -12 -55, 0 -60 C 12 -55, 22 -30, 0 0 Z" fill="url(#brushedGold)" stroke="#9E761C" stroke-width="0.8" transform="rotate(300)"/>

      <!-- Inner Cup Petals -->
      <circle cx="0" cy="0" r="20" fill="url(#brushedGold)" stroke="#8C6615" stroke-width="1"/>
      <circle cx="0" cy="0" r="14" fill="#DDB24A" stroke="#7E580B" stroke-width="1"/>
      <!-- Sparkling Center Diamond Solitaire -->
      <circle cx="0" cy="0" r="7" fill="#FFFFFF" stroke="#B8943B" stroke-width="1.2"/>
      <circle cx="-2" cy="-2" r="2.5" fill="#FFF"/>
    </g>

    <!-- Side Foliage Leaves with Embedded Pavé Stones -->
    <path d="M -20 -15 C -45 -30, -65 -15, -55 5 C -40 20, -25 5, -20 -15 Z" fill="url(#brushedGold)" stroke="#9E761C" stroke-width="0.8"/>
    <path d="M 20 -15 C 45 -30, 65 -15, 55 5 C 40 20, 25 5, 20 -15 Z" fill="url(#brushedGold)" stroke="#9E761C" stroke-width="0.8"/>
    <path d="M -15 35 C -40 50, -55 40, -45 20 C -30 10, -15 25, -15 35 Z" fill="url(#brushedGold)" stroke="#9E761C" stroke-width="0.8"/>
    <path d="M 15 35 C 40 50, 55 40, 45 20 C 30 10, 15 25, 15 35 Z" fill="url(#brushedGold)" stroke="#9E761C" stroke-width="0.8"/>

    <!-- Luminous Freshwater Rice Pearl Sprays -->
    <ellipse cx="-45" cy="-25" rx="5" ry="8" fill="url(#pearlShine)" transform="rotate(-30 -45 -25)"/>
    <ellipse cx="45" cy="-25" rx="5" ry="8" fill="url(#pearlShine)" transform="rotate(30 45 -25)"/>
    <ellipse cx="-52" cy="15" rx="5" ry="8" fill="url(#pearlShine)" transform="rotate(-60 -52 15)"/>
    <ellipse cx="52" cy="15" rx="5" ry="8" fill="url(#pearlShine)" transform="rotate(60 52 15)"/>

    <!-- Bottom Hanging Branch & Teardrop Pearls -->
    <path d="M 0 45 Q -10 75, -20 95 M 0 45 Q 10 75, 20 95 M 0 45 L 0 115" stroke="url(#brushedGold)" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="-20" cy="98" rx="5" ry="9" fill="url(#pearlShine)" transform="rotate(-15 -20 98)"/>
    <ellipse cx="20" cy="98" rx="5" ry="9" fill="url(#pearlShine)" transform="rotate(15 20 98)"/>
    <!-- Bottom Diamond Pavé Leaf -->
    <path d="M 0 100 C -10 110, -5 130, 0 138 C 5 130, 10 110, 0 100 Z" fill="url(#brushedGold)" stroke="#8C6615" stroke-width="1"/>
    <circle cx="0" cy="115" r="2" fill="#FFF"/>
    <circle cx="0" cy="123" r="1.8" fill="#FFF"/>
  </g>

  <!-- 3. Right Side: Elegant Architectural Feature Card -->
  <g transform="translate(350, 45)">
    <rect width="415" height="270" rx="12" fill="#FFFFFF" stroke="#EAE0D5" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Header -->
    <text x="28" y="38" font-family="'Cinzel', Georgia, serif" font-size="17" font-weight="700" fill="#2C2422">The Magic of Bridal Chandelier Earrings</text>
    <line x1="28" y1="52" x2="385" y2="52" stroke="#EFE5D8" stroke-width="1.5"/>

    <!-- Point 1 -->
    <circle cx="42" cy="85" r="6" fill="#C5A059"/>
    <text x="60" y="88" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="700" fill="#2C2422">Face-Framing Golden Radiance</text>
    <text x="60" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#7A6E6C">Brushed 18k gold casts a flattering glow across the jawline.</text>

    <!-- Point 2 -->
    <circle cx="42" cy="140" r="6" fill="#C5A059"/>
    <text x="60" y="143" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="700" fill="#2C2422">Dynamic Fluid Motion</text>
    <text x="60" y="161" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#7A6E6C">Botanical tiers sway gracefully with your walk down the aisle.</text>

    <!-- Point 3 -->
    <circle cx="42" cy="195" r="6" fill="#C5A059"/>
    <text x="60" y="198" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="700" fill="#2C2422">Lustrous Pearl &amp; Diamond Fire</text>
    <text x="60" y="216" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#7A6E6C">Freshwater seeds soften gold while diamonds catch reception lights.</text>

    <!-- Badge -->
    <rect x="28" y="235" width="357" height="24" rx="6" fill="#FAF4EB"/>
    <text x="206" y="251" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="10.5" font-weight="700" fill="#8C6826" letter-spacing="1">REGAL BRIDAL HEIRLOOM • SILVERPETALS</text>
  </g>
</svg>
