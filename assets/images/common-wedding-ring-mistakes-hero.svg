<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="50%" stop-color="#F4ECE1" />
      <stop offset="100%" stop-color="#EAE0D2" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="25%" stop-color="#E5C388" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#8C6826" />
    </linearGradient>

    <!-- Metallic Platinum Gradient -->
    <linearGradient id="platGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E6EA" />
      <stop offset="70%" stop-color="#B8C0C8" />
      <stop offset="100%" stop-color="#8A94A0" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#FAF6F0" stop-opacity="0.94" />
    </linearGradient>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4A3E3D" flood-opacity="0.09" />
    </filter>

    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#8C6826" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Elegant Inner Border -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#D8C8B4" stroke-width="1.5" stroke-dasharray="6,4" rx="16" />

  <!-- Header Banner -->
  <g transform="translate(60, 52)">
    <text x="0" y="24" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="13" font-weight="700" letter-spacing="4" fill="#8C6826">SILVERPETALS™ FINE JEWELRY • BRIDAL BUYER'S GUIDE</text>
    <text x="0" y="68" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="38" font-weight="700" fill="#2C2422">Common Wedding Ring Mistakes</text>
    <text x="0" y="98" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16" fill="#6A5F5D">10 Critical Pitfalls in Sizing, Metals, Proportions &amp; Daily Wear — And How to Avoid Them</text>
  </g>

  <!-- 3 Illustrated Focus Cards -->
  <!-- Card 1: Sizing & Comfort -->
  <g transform="translate(60, 180)" filter="url(#shadowFilter)">
    <rect width="330" height="360" rx="14" fill="url(#cardGrad)" stroke="#E8DAC8" stroke-width="1" />
    <circle cx="165" cy="75" r="42" fill="#F6EFE5" stroke="#D6BEA2" stroke-width="1.5" />
    <!-- Caliper / Sizer Icon -->
    <circle cx="165" cy="75" r="26" fill="none" stroke="url(#goldGrad)" stroke-width="6" filter="url(#ringGlow)" />
    <path d="M 135 75 L 195 75" stroke="#8C6826" stroke-width="1.5" stroke-dasharray="3,3" />
    <path d="M 135 68 L 135 82 M 195 68 L 195 82" stroke="#8C6826" stroke-width="2" />

    <text x="165" y="152" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="700" fill="#2C2422">1. Sizing &amp; Fit</text>
    <text x="165" y="178" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#C5A059">TEMPERATURE &amp; PROFILE</text>
    <text x="165" y="215" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#5A4E4C">Never guess your ring size.</text>
    <text x="165" y="238" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#7A6E6C">Finger dimensions shift with heat,</text>
    <text x="165" y="258" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#7A6E6C">activity, and wider ring profiles.</text>
    <rect x="45" y="295" width="240" height="30" rx="6" fill="#F4EDE3" />
    <text x="165" y="315" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#8C6826">Opt for Comfort-Fit Interiors</text>
  </g>

  <!-- Card 2: Metal Selection -->
  <g transform="translate(435, 180)" filter="url(#shadowFilter)">
    <rect width="330" height="360" rx="14" fill="url(#cardGrad)" stroke="#E8DAC8" stroke-width="1" />
    <circle cx="165" cy="75" r="42" fill="#F6EFE5" stroke="#D6BEA2" stroke-width="1.5" />
    <!-- Two Interlocking Metal Bands -->
    <ellipse cx="150" cy="75" rx="22" ry="26" fill="none" stroke="url(#goldGrad)" stroke-width="5" />
    <ellipse cx="180" cy="75" rx="22" ry="26" fill="none" stroke="url(#platGrad)" stroke-width="5" />

    <text x="165" y="152" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="700" fill="#2C2422">2. Metal Matching</text>
    <text x="165" y="178" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#C5A059">HARDNESS &amp; RESIZING</text>
    <text x="165" y="215" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#5A4E4C">Avoid mismatched alloys.</text>
    <text x="165" y="238" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#7A6E6C">Platinum wears down softer gold,</text>
    <text x="165" y="258" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#7A6E6C">and alternative metals cannot resize.</text>
    <rect x="45" y="295" width="240" height="30" rx="6" fill="#F4EDE3" />
    <text x="165" y="315" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#8C6826">Match Karats &amp; Hardness</text>
  </g>

  <!-- Card 3: Daily Care & Lifestyle -->
  <g transform="translate(810, 180)" filter="url(#shadowFilter)">
    <rect width="330" height="360" rx="14" fill="url(#cardGrad)" stroke="#E8DAC8" stroke-width="1" />
    <circle cx="165" cy="75" r="42" fill="#F6EFE5" stroke="#D6BEA2" stroke-width="1.5" />
    <!-- Shield / Protection Diamond Icon -->
    <path d="M 165 48 L 190 62 L 180 92 L 165 102 L 150 92 L 140 62 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
    <circle cx="165" cy="75" r="6" fill="#C5A059" />

    <text x="165" y="152" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="700" fill="#2C2422">3. Wear &amp; Protection</text>
    <text x="165" y="178" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#C5A059">INSURANCE &amp; INSPECTION</text>
    <text x="165" y="215" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#5A4E4C">Protect your daily heirloom.</text>
    <text x="165" y="238" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#7A6E6C">Annual prong inspection and</text>
    <text x="165" y="258" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#7A6E6C">dedicated jewelry insurance matter.</text>
    <rect x="45" y="295" width="240" height="30" rx="6" fill="#F4EDE3" />
    <text x="165" y="315" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#8C6826">Annual Checkups &amp; Gentle Clean</text>
  </g>

  <!-- Bottom Brand Tagline -->
  <text x="600" y="580" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#8A7E7C">SilverPetals™ Expert Guides • Timeless Handcrafted Jewelry</text>
</svg>
