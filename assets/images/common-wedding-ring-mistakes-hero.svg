<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Warm Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="50%" stop-color="#F5EFEB"/>
      <stop offset="100%" stop-color="#EDE4DC"/>
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldRingGrad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#C59B27"/>
      <stop offset="20%" stop-color="#FFF3C4"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E5C158"/>
      <stop offset="70%" stop-color="#A67C1E"/>
      <stop offset="85%" stop-color="#FFF9E0"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>

    <linearGradient id="goldInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7A560F"/>
      <stop offset="100%" stop-color="#4A3405"/>
    </linearGradient>

    <!-- Metallic Platinum Gradient -->
    <linearGradient id="platRingGrad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#8F969E"/>
      <stop offset="25%" stop-color="#E4E8EC"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#CAD0D6"/>
      <stop offset="100%" stop-color="#737A82"/>
    </linearGradient>

    <linearGradient id="platInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#555C64"/>
      <stop offset="100%" stop-color="#34383C"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#FBF9F5" stop-opacity="0.92"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#5A4A42" flood-opacity="0.08"/>
    </filter>
    <filter id="ringShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#3A2818" flood-opacity="0.26"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle Header Divider -->
  <line x1="80" y1="120" x2="1120" y2="120" stroke="#D8C8B8" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Top Brand & Header (Centered, Perfectly Clean) -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <text font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="14" font-weight="600" letter-spacing="4" fill="#8C7355" text-transform="uppercase">SILVERPETALS™ FINE JEWELRY GUIDES</text>
    <text y="38" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="#2C241E" letter-spacing="0.5">Common Wedding Ring Mistakes</text>
    <text y="58" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#7A6858" font-weight="400">10 Critical Pitfalls in Sizing, Metal Durability, Ring Stacking &amp; Lifetime Care</text>
  </g>

  <!-- LEFT CARD: SIZING & PROPORTIONS -->
  <g transform="translate(100, 150)">
    <rect width="480" height="430" rx="16" fill="url(#cardGrad)" stroke="#E4D8CC" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Title Badge -->
    <rect x="36" y="28" width="150" height="28" rx="14" fill="#EFE8DE"/>
    <text x="111" y="47" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#755E43" text-anchor="middle" letter-spacing="1">FIT &amp; PROPORTION</text>
    
    <text x="36" y="86" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="700" fill="#2C241E">Sizing &amp; Comfort Fit</text>
    <text x="36" y="110" font-family="'Inter', sans-serif" font-size="13" fill="#7A6858">Temperature shifts • Band width • Curved ergonomic dome</text>

    <!-- Ring Illustration: Yellow Gold Comfort Band -->
    <g transform="translate(240, 245)" filter="url(#ringShadow)">
      <!-- Outer Oval -->
      <ellipse cx="0" cy="0" rx="130" ry="75" fill="url(#goldRingGrad)"/>
      <!-- Inner Hole -->
      <ellipse cx="0" cy="4" rx="88" ry="46" fill="url(#goldInnerGrad)"/>
      <!-- Inner lower lip reflection -->
      <path d="M -88,4 A 88,46 0 0,0 88,4 A 88,42 0 0,1 -88,4 Z" fill="#FFF3C4" opacity="0.75"/>
      <!-- Intense Mirror Flare Highlight -->
      <ellipse cx="-45" cy="-38" rx="40" ry="10" fill="#FFFFFF" opacity="0.9" transform="rotate(-15, -45, -38)"/>
      <!-- Star Sparkle on Polished Edge -->
      <path d="M -70,-38 Q -60,-38 -60,-48 Q -60,-38 -50,-38 Q -60,-38 -60,-28 Q -60,-38 -70,-38 Z" fill="#FFFFFF"/>
      <circle cx="-60" cy="-38" r="3" fill="#FFFFFF"/>
    </g>

    <!-- Feature Checklist -->
    <g transform="translate(40, 360)" font-family="'Inter', sans-serif" font-size="12.5" fill="#4A3E34">
      <circle cx="8" cy="8" r="4" fill="#C59B27"/>
      <text x="22" y="12" font-weight="600">Never guess finger size or use paper cutouts</text>

      <circle cx="8" cy="32" r="4" fill="#C59B27"/>
      <text x="22" y="36" font-weight="600">Always factor in width (wider bands fit tighter)</text>

      <circle cx="8" cy="56" r="4" fill="#C59B27"/>
      <text x="22" y="60" font-weight="600">Choose comfort-fit interiors for daily ease</text>
    </g>
  </g>

  <!-- RIGHT CARD: METAL & HARMONY -->
  <g transform="translate(620, 150)">
    <rect width="480" height="430" rx="16" fill="url(#cardGrad)" stroke="#E4D8CC" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Title Badge -->
    <rect x="36" y="28" width="165" height="28" rx="14" fill="#E8E3DF"/>
    <text x="118" y="47" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#5A4E46" text-anchor="middle" letter-spacing="1">METAL &amp; HARMONY</text>
    
    <text x="36" y="86" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="700" fill="#2C241E">Metals &amp; Ring Stacking</text>
    <text x="36" y="110" font-family="'Inter', sans-serif" font-size="13" fill="#7A6858">Hardness matching • Flush settings • Resizing guarantees</text>

    <!-- Ring Illustration: Platinum Band paired with Brilliant Diamond Solitaire -->
    <g transform="translate(240, 245)" filter="url(#ringShadow)">
      <!-- Outer Oval -->
      <ellipse cx="0" cy="0" rx="130" ry="75" fill="url(#platRingGrad)"/>
      <!-- Inner Hole -->
      <ellipse cx="0" cy="4" rx="88" ry="46" fill="url(#platInnerGrad)"/>
      <!-- Inner lower lip reflection -->
      <path d="M -88,4 A 88,46 0 0,0 88,4 A 88,42 0 0,1 -88,4 Z" fill="#E4E8EC" opacity="0.8"/>
      <!-- Intense Mirror Flare Highlight -->
      <ellipse cx="-45" cy="-38" rx="40" ry="10" fill="#FFFFFF" opacity="0.9" transform="rotate(-15, -45, -38)"/>
      
      <!-- Diamond Setting on Top -->
      <g transform="translate(0, -74)">
        <polygon points="0,-22 18,0 0,22 -18,0" fill="#FFFFFF" stroke="#CAD0D6" stroke-width="1"/>
        <polygon points="0,-22 10,0 0,12 -10,0" fill="#EAF3FA" opacity="0.8"/>
        <!-- Star Sparkle -->
        <path d="M 0,-24 Q 0,-34 6,-34 Q 0,-34 0,-44 Q 0,-34 -6,-34 Q 0,-34 0,-24 Z" fill="#FFFFFF"/>
        <circle cx="0" cy="-34" r="2.5" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Feature Checklist -->
    <g transform="translate(40, 360)" font-family="'Inter', sans-serif" font-size="12.5" fill="#4A3E34">
      <circle cx="8" cy="8" r="4" fill="#8F969E"/>
      <text x="22" y="12" font-weight="600">Match metal hardness to prevent abrasive wear</text>

      <circle cx="8" cy="32" r="4" fill="#8F969E"/>
      <text x="22" y="36" font-weight="600">Test flush fit with your engagement ring</text>

      <circle cx="8" cy="56" r="4" fill="#8F969E"/>
      <text x="22" y="60" font-weight="600">Ensure yearly bench inspection and insurance</text>
    </g>
  </g>
</svg>
