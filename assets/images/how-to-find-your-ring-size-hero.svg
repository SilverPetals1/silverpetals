<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F6"/>
      <stop offset="50%" stop-color="#F5F0E8"/>
      <stop offset="100%" stop-color="#EDE4D6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C99D"/>
      <stop offset="50%" stop-color="#CFAA7A"/>
      <stop offset="100%" stop-color="#A9834F"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1FBECA"/>
      <stop offset="100%" stop-color="#128994"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle Decorative Background Circles -->
  <circle cx="950" cy="315" r="260" fill="none" stroke="#CFAA7A" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6,6"/>
  <circle cx="950" cy="315" r="320" fill="none" stroke="#1FBECA" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Left Content Card -->
  <g transform="translate(80, 100)">
    <!-- Brand Badge -->
    <rect x="0" y="0" width="180" height="34" rx="17" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <circle cx="18" cy="17" r="6" fill="url(#tealGrad)"/>
    <text x="34" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#128994" letter-spacing="1.5">SILVERPETALS™</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" fill="#2B2D42">How to Find Your</text>
    <text x="0" y="140" font-family="'Playfair Display', Georgia, serif" font-size="48" font-weight="700" fill="url(#tealGrad)">Perfect Ring Size</text>

    <!-- Subtitle / Hook -->
    <text x="0" y="190" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" fill="#64748B" font-weight="500">
      <tspan x="0" dy="0">Complete At-Home Sizing Guide, Millimeter Precision Charts,</tspan>
      <tspan x="0" dy="28">&amp; Professional Bench Jeweler Measuring Techniques.</tspan>
    </text>

    <!-- 3 Key Feature Pills -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="140" height="42" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="20" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#2B2D42">📏 Paper Strip</text>

      <rect x="155" y="0" width="140" height="42" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="175" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#2B2D42">💍 Ring Ruler</text>

      <rect x="310" y="0" width="160" height="42" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="328" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#2B2D42">🌐 US/UK/EU Chart</text>
    </g>

    <!-- Trust Stamp -->
    <text x="0" y="370" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="1">
      ✓ ACCURATE MILLIMETER CONVERSION • FREE SIZING TEMPLATES
    </text>
  </g>

  <!-- Right Hero Visual: Luxury Ring Diagram with Measurements -->
  <g transform="translate(930, 315)">
    <!-- Soft Backing Glow -->
    <circle cx="0" cy="0" r="190" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <!-- Outer Ring Band (Silver/Gold) -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="url(#goldGrad)" stroke-width="26"/>
    <circle cx="0" cy="0" r="150" fill="none" stroke="url(#silverGrad)" stroke-width="18" stroke-dasharray="140, 40"/>

    <!-- Inner Circumference Boundary -->
    <circle cx="0" cy="0" r="137" fill="none" stroke="#128994" stroke-width="2.5" stroke-dasharray="5,5"/>

    <!-- Inner Core Display -->
    <circle cx="0" cy="0" r="120" fill="#FAF9F6"/>

    <!-- Center Ring Size Callout -->
    <text x="0" y="-20" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#64748B" letter-spacing="2">SAMPLE SIZE</text>
    <text x="0" y="25" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="46" font-weight="700" fill="#128994">US 7.0</text>
    <text x="0" y="55" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#CFAA7A">17.3 mm Diameter</text>
    <text x="0" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">54.4 mm Circumference</text>

    <!-- Diameter Measurement Arrow -->
    <line x1="-137" y1="0" x2="-80" y2="0" stroke="#128994" stroke-width="2"/>
    <line x1="80" y1="0" x2="137" y2="0" stroke="#128994" stroke-width="2"/>
    <!-- Arrows on ends -->
    <polygon points="-137,0 -127,-4 -127,4" fill="#128994"/>
    <polygon points="137,0 127,-4 127,4" fill="#128994"/>

    <!-- Top Callout Tag -->
    <g transform="translate(0, -175)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#128994"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">INSIDE DIAMETER (Ø)</text>
    </g>

    <!-- Bottom Callout Tag -->
    <g transform="translate(0, 175)">
      <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#FFFFFF" stroke="#CFAA7A" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#A9834F">CIRCUMFERENCE (2πr)</text>
    </g>
  </g>
</svg>
