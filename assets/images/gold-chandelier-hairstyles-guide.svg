<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <defs>
    <linearGradient id="hairChBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="100%" stop-color="#F3ECE2"/>
    </linearGradient>
  </defs>

  <rect width="800" height="350" rx="14" fill="url(#hairChBg)"/>
  <text x="400" y="38" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="700" fill="#2C2422">Hairstyle &amp; Veil Pairing with Chandelier Earrings</text>
  <text x="400" y="60" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#7A6E6C">Ensuring your earrings remain visible and tangle-free all day</text>

  <!-- 1. Sleek Updo -->
  <g transform="translate(30, 85)">
    <rect width="170" height="235" rx="10" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <circle cx="85" cy="42" r="16" fill="#D5C2AA"/>
    <circle cx="85" cy="34" r="8" fill="#8C6826"/>
    <text x="85" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Sleek Updo / Bun</text>
    <text x="85" y="120" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8C6826">Center Stage Display</text>
    <text x="85" y="146" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Full 360° visibility</text>
    <text x="85" y="166" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Showcases every tier</text>
    <text x="85" y="186" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Flawless side portraits</text>
    <text x="85" y="214" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#2C2422">Maximum Visibility</text>
  </g>

  <!-- 2. Hollywood Waves -->
  <g transform="translate(220, 85)">
    <rect width="170" height="235" rx="10" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <circle cx="85" cy="42" r="14" fill="#D5C2AA"/>
    <path d="M 68 40 Q 64 56 68 68 M 102 40 Q 106 56 102 68" fill="none" stroke="#8C6826" stroke-width="4" stroke-linecap="round"/>
    <text x="85" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Hollywood Waves</text>
    <text x="85" y="120" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8C6826">Wider Tiered Styles</text>
    <text x="85" y="146" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Tuck one side behind ear</text>
    <text x="85" y="166" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Gleams through tresses</text>
    <text x="85" y="186" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Glamorous vintage aura</text>
    <text x="85" y="214" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#2C2422">High Glamour</text>
  </g>

  <!-- 3. Half-Up Braids -->
  <g transform="translate(410, 85)">
    <rect width="170" height="235" rx="10" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <circle cx="85" cy="40" r="14" fill="#D5C2AA"/>
    <path d="M 82 50 L 88 56 L 82 62 L 88 68" fill="none" stroke="#8C6826" stroke-width="3" stroke-linecap="round"/>
    <text x="85" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Half-Up Braids</text>
    <text x="85" y="120" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8C6826">Botanical Motifs</text>
    <text x="85" y="146" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Gold vines and leaves</text>
    <text x="85" y="166" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Pulls front hair back</text>
    <text x="85" y="186" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Boho luxury romance</text>
    <text x="85" y="214" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#2C2422">Boho Chic</text>
  </g>

  <!-- 4. Wearing a Veil -->
  <g transform="translate(600, 85)">
    <rect width="170" height="235" rx="10" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <path d="M 75 36 C 85 30 85 30 95 36 C 98 50 106 68 106 72 L 64 72 C 64 68 72 50 75 36 Z" fill="#F4ECE1" stroke="#C5A059" stroke-width="1.2" stroke-dasharray="2,2"/>
    <text x="85" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2C2422">Veil Precautions</text>
    <text x="85" y="120" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8C6826">Leverbacks &amp; Smooth Bezels</text>
    <text x="85" y="146" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Prevents tulle snags</text>
    <text x="85" y="166" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Secure lock clasp</text>
    <text x="85" y="186" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#7A6E6C">Won't catch when moving</text>
    <text x="85" y="214" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#2C2422">Tangle Free</text>
  </g>
</svg>
