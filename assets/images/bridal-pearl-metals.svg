<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <linearGradient id="bgP6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7"/><stop offset="100%" stop-color="#F2EBE0"/>
    </linearGradient>
    <linearGradient id="silverBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/><stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A"/><stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="roseBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FECDD3"/><stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>
  <rect width="800" height="320" rx="14" fill="url(#bgP6)"/>
  <text x="400" y="38" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="17" font-weight="700" fill="#2C2422">Choosing the Right Metal Tone for Wedding Pearls</text>
  <g transform="translate(40, 65)">
    <rect width="220" height="225" rx="8" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <rect x="25" y="25" width="170" height="12" rx="6" fill="url(#silverBar)"/>
    <text x="110" y="65" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#2C2422">925 Sterling Silver / Platinum</text>
    <text x="110" y="95" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#475569">Pure White &amp; Crisp Silver</text>
    <text x="110" y="125" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#7A6E6C">Best for pure white dresses</text>
    <text x="110" y="145" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#7A6E6C">Cool skin undertones</text>
    <text x="110" y="165" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#7A6E6C">Enhances white freshwater pearls</text>
    <text x="110" y="195" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#8C6826">Modern &amp; Luminous</text>
  </g>
  <g transform="translate(290, 65)">
    <rect width="220" height="225" rx="8" fill="#FFF" stroke="#E2D5C7" stroke-width="1"/>
    <rect x="25" y="25" width="170" height="12" rx="6" fill="url(#goldBar)"/>
    <text x="110" y="65" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#2C2422">14K / 18K Yellow Gold</text>
    <text x="110" y="95" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#B45309">Warm Vintage Radiance</text>
    <text x="110" y="125" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#7A6E6C">Best for ivory, champagne &amp; lace</text>
    <text x="110" y="145" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#7A6E6C">Warm and olive skin undertones</text>
    <text x="110" y="165" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#7A6E6C">Accentuates cream pearl luster</text>
    <text x="110" y="195" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#8C6826">Classic &amp; Romantic</text>
  </g>
  <g transform="translate(540, 65)">
