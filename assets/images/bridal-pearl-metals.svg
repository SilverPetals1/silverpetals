    <text x="110" y="65" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#2C2422">Rose Gold</text>
    <text x="110" y="95" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#BE123C">Blush &amp; Floral Warmth</text>
    <text x="110" y="125" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#7A6E6C">Best for blush undertones &amp; tulle</text>
    <text x="110" y="145" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#7A6E6C">Neutral and warm skin complexions</text>
    <text x="110" y="165" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#7A6E6C">Flattering feminine contrast</text>
    <text x="110" y="195" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#8C6826">Contemporary Romantic</text>
